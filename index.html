<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>소탕! 방치형 헌터</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#05060c;overflow:hidden;color:#e8ecf5;user-select:none;
    font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  /* 기준 프레임 1080x2340(9:19.5), 폭 고정·세로 가변. 레퍼런스 좌표는 이 1080 프레임 기준 그대로 사용.
     #legacy = 구 540x960 UI를 통째로 2배 스케일한 임시 스캐폴드(화면별로 순차 교체 예정).
     신규 화면(팝업 등)은 #app 바로 아래 형제로, 1080 좌표계를 변환 없이 그대로 쓴다. */
  #app{flex:none;width:1080px;height:2340px;transform-origin:center center;position:relative;overflow:hidden;
    background:#0a0c16;box-shadow:0 0 70px rgba(90,140,255,.16)}
  #legacy{position:absolute;left:0;top:0;width:540px;height:960px;
    transform:scale(2);transform-origin:top left;display:flex;flex-direction:column}

  /* ============ 최상단: 프로필 + 재화 ============ */
  #top{flex:none;height:56px;display:flex;align-items:center;gap:6px;padding:5px 7px;
    background:linear-gradient(180deg,#1d2647,#131a33);border-bottom:2px solid #3a4778}
  .prof{display:flex;align-items:center;gap:6px;cursor:pointer;flex:none}
  .pface{width:42px;height:42px;border-radius:10px;flex:none;
    border:2px solid #f0b44c;background:linear-gradient(180deg,#2b3560,#1a2242);
    display:flex;align-items:center;justify-content:center;font-size:21px;position:relative}
  .pface b{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);background:#f0b44c;color:#2a2107;
    font-size:8.5px;font-weight:900;border-radius:6px;padding:0 4px;border:1px solid #7a5410;white-space:nowrap}
  .pinfo{width:96px}
  .pcp{font-size:12.5px;font-weight:900;color:#ffd45e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pexp{height:6px;border-radius:3px;background:#0d1226;border:1px solid #2b3866;margin-top:3px;overflow:hidden}
  .pexp>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#7ce6a0,#49c46e)}
  .prank{font-size:9.5px;font-weight:900;color:#9fc0ff;margin-top:2px}

  .curs{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
  .crow{display:flex;gap:4px}
  .cbox{flex:1;display:flex;align-items:center;gap:3px;background:#0b0f22;border:1.3px solid #2f3d70;
    border-radius:20px;padding:2px 3px 2px 6px;min-width:0}
  .cbox i{font-style:normal;font-size:11px;flex:none}
  .cbox b{flex:1;font-size:11px;font-weight:900;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cbox u{flex:none;width:15px;height:15px;border-radius:50%;background:linear-gradient(180deg,#7ce6a0,#3aa860);
    color:#06281a;font-size:12px;font-weight:900;line-height:14px;text-align:center;text-decoration:none;cursor:pointer}
  .cGold b{color:#ffd45e}.cDia b{color:#7fe0ff}.cRel b{color:#d9a2ff}

  /* ============ 전투 화면 ============ */
  #stagearea{position:relative;flex:none;width:540px;height:372px;background:#0a0c16}
  #view{display:block;width:540px;height:372px}

  /* 스테이지 정보 (상단 중앙) */
  #stinfo{position:absolute;left:50%;transform:translateX(-50%);top:5px;width:230px;text-align:center;pointer-events:none}
  #stinfo .chap{font-size:12.5px;font-weight:900;text-shadow:0 1px 3px #000;letter-spacing:-.3px}
  #stinfo .chap em{font-style:normal;color:#ffd45e}
  #stinfo .kbar{height:8px;border-radius:4px;background:rgba(6,9,20,.9);border:1px solid #3a4778;
    margin-top:3px;overflow:hidden;position:relative}
  #stinfo .kbar>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#ff8a5c,#ffd45e)}
  #stinfo .kbar span{position:absolute;inset:0;font-size:7.5px;line-height:8px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000}

  /* 좌우 세로 아이콘 */
  .side{position:absolute;top:44px;display:flex;flex-direction:column;gap:4px;z-index:3}
  #sideL{left:5px}
  #sideR{right:5px}
  .ibtn{width:44px;height:43px;border-radius:10px;position:relative;cursor:pointer;
    background:linear-gradient(180deg,#2a3663,#18203c);border:1.5px solid #4d5e99;
    display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ibtn .si{font-size:16px;line-height:17px}
  .ibtn .sl{font-size:8px;font-weight:900;color:#c2d0f0;margin-top:1px}
  .ibtn .bdg{position:absolute;top:-3px;right:-3px;min-width:14px;height:14px;border-radius:7px;background:#ff3b5c;
    color:#fff;font-size:8.5px;font-weight:900;line-height:14px;text-align:center;padding:0 3px;
    border:1.5px solid #0a0c16;display:none}
  .ibtn.on .bdg{display:block}

  /* 플레이어 HP + 스킬 슬롯 */
  #battlefoot{position:absolute;left:0;right:0;bottom:0;padding:4px 6px 5px;
    background:linear-gradient(180deg,rgba(8,11,24,0),rgba(8,11,24,.92) 35%)}
  #hpwrap{height:12px;border-radius:6px;background:rgba(6,9,20,.9);border:1px solid #4a2b3a;
    overflow:hidden;position:relative}
  #hpwrap>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff3b5c,#ff9a5c)}
  #hpwrap span{position:absolute;inset:0;font-size:8px;line-height:12px;text-align:center;font-weight:900;
    color:#fff;text-shadow:0 1px 2px #000}
  #slots{display:flex;gap:3px;margin-top:4px}
  .slot2{flex:1;height:36px;border-radius:8px;background:#141b33;border:1.4px solid #33406e;
    position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:16px}
  .slot2.empty{opacity:.3;font-size:11px;color:#5c6789}
  .slot2 .cdv{position:absolute;left:0;right:0;bottom:0;background:rgba(6,9,20,.72);height:0%}
  .slot2 .lvv2{position:absolute;bottom:1px;right:2px;font-size:7.5px;font-weight:900;color:#ffd45e;z-index:2}

  /* 튜토리얼 배너 */
  #tuto{flex:none;display:flex;align-items:center;gap:7px;padding:5px 8px;
    background:linear-gradient(90deg,#241a42,#2e2352);border-top:1.5px solid #6d54ad;border-bottom:1.5px solid #6d54ad}
  #tuto.off{display:none}
  #tuto .tinfo{flex:1;min-width:0}
  #tuto .tt{font-size:11.5px;font-weight:900;color:#ffe9a8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #tuto .tp{height:5px;border-radius:3px;background:#171b34;margin:3px 0 2px;overflow:hidden}
  #tuto .tp>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#ffd45e,#ff9a5c)}
  #tuto .tsub{font-size:9.5px;color:#a9bbe6;font-weight:800}
  #tuto .tbtn{flex:none;padding:7px 11px;border-radius:8px;border:0;font-size:11px;font-weight:900;
    color:#2a2107;background:linear-gradient(180deg,#ffe07a,#f0a63c);cursor:pointer}
  #tuto .tbtn:disabled{background:#26304e;color:#6e7a9c;cursor:default}

  /* ============ 패널 ============ */
  #panel{flex:1;min-height:0;background:#0d1020;display:flex;flex-direction:column}
  .body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 8px 14px;display:none}
  .body.on{display:block}
  .body::-webkit-scrollbar{width:5px}
  .body::-webkit-scrollbar-thumb{background:#2a3357;border-radius:3px}

  #tabbar{flex:none;height:60px;display:flex;background:linear-gradient(180deg,#1a2240,#0b0f1e);
    border-top:2px solid #3a4778}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    cursor:pointer;position:relative}
  .tab .ti{font-size:19px;line-height:20px;filter:grayscale(.6) opacity(.65)}
  .tab .tl{font-size:9.5px;font-weight:900;color:#7787ab}
  .tab.on{background:linear-gradient(180deg,#2c3a6b,#1a2447);box-shadow:inset 0 2px 0 #7fd0ff}
  .tab.on .ti{filter:none;transform:translateY(-1px)}
  .tab.on .tl{color:#9fdcff}
  .tab .bdg{position:absolute;top:6px;right:calc(50% - 19px);width:9px;height:9px;border-radius:50%;
    background:#ff3b5c;border:1.5px solid #0b0f1e;display:none}
  .tab.alert .bdg{display:block}

  /* ============ 공통 파츠 ============ */
  .sect{background:linear-gradient(180deg,#182144,#121a34);border:1.5px solid #33406e;
    border-radius:12px;padding:9px 10px;margin-bottom:8px}
  .sect h3{font-size:12.5px;color:#bfd4ff;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
  .sect h3 em{font-style:normal;font-size:11px;color:#8fd6ff;font-weight:800}
  .sect p{font-size:11.5px;color:#9fb0d4;line-height:1.65;font-weight:700}
  .sect p b{color:#ffd45e}
  .gbtn{display:block;width:100%;padding:11px;border-radius:10px;border:0;cursor:pointer;
    font-size:13px;font-weight:900;color:#2a2107;background:linear-gradient(180deg,#ffe07a,#f0a63c);
    box-shadow:0 2px 0 #a06d1c}
  .gbtn.blue{color:#062033;background:linear-gradient(180deg,#8fe6ff,#4aa8ff);box-shadow:0 2px 0 #1d68a8}
  .gbtn.green{color:#06281a;background:linear-gradient(180deg,#9df0b0,#48c882);box-shadow:0 2px 0 #1e7a4c}
  .gbtn.purple{color:#160b28;background:linear-gradient(180deg,#d3a8ff,#9b5cf0);box-shadow:0 2px 0 #6a2bb0}
  .gbtn:disabled{background:#26304e;color:#68738f;box-shadow:none;cursor:default}
  .gbtn small{display:block;font-size:10px;font-weight:800;opacity:.85}
  .row2{display:flex;gap:6px}
  .row2>*{flex:1}
  .subtabs{display:flex;gap:5px;margin-bottom:8px}
  .stab{flex:1;padding:8px 0;text-align:center;font-size:11.5px;font-weight:900;border-radius:9px;
    background:#141b34;border:1.4px solid #2b3866;color:#8d9cc2;cursor:pointer}
  .stab.on{background:linear-gradient(180deg,#2b3f74,#1e2c56);border-color:#5f7cc4;color:#bfe0ff}

  .up{display:flex;align-items:center;gap:9px;padding:8px 9px;margin-bottom:6px;border-radius:11px;
    background:linear-gradient(180deg,#172046,#121a34);border:1.4px solid #2b3866;cursor:pointer}
  .up.no{opacity:.45}
  .up .ic{width:34px;height:34px;flex:none;border-radius:9px;display:flex;align-items:center;
    justify-content:center;font-size:18px;background:#202c56;border:1px solid #3a4c88}
  .up .uinfo{flex:1;min-width:0}
  .up .un{font-size:12.5px;font-weight:900}
  .up .un i{font-style:normal;font-size:10.5px;color:#6ec6ff;margin-left:5px}
  .up .uv{font-size:10.5px;color:#8b9ac0;margin-top:2px;font-weight:800;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .up .uc{flex:none;text-align:right;font-size:11.5px;font-weight:900;color:#ffd45e;white-space:nowrap}
  .up .uc small{display:block;font-size:9px;color:#7b88a8;font-weight:800}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .cell{position:relative;border-radius:10px;padding:5px 3px 4px;text-align:center;cursor:pointer;
    background:#131828;border:1.6px solid #262f52;overflow:hidden}
  .cell.lock{opacity:.38}
  .cell canvas{display:block;margin:0 auto}
  .cell .nm{font-size:9.5px;font-weight:900;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cell .lvv{font-size:9px;font-weight:800;color:#93a2c6}
  .cell .eqm{position:absolute;top:2px;left:2px;font-size:8px;font-weight:900;background:#2f9d5b;
    color:#eafff2;border-radius:4px;padding:0 3px}
  .cell .frag{position:absolute;top:2px;right:2px;font-size:8px;font-weight:900;
    background:#1b2445;color:#a9bbe6;border-radius:4px;padding:0 3px}

  .odds{display:flex;gap:3px;margin-top:6px}
  .odds div{flex:1;text-align:center;font-size:8.5px;font-weight:900;border-radius:5px;padding:3px 0;
    background:#0e1428;border:1px solid #26304e}
  .sexp{height:7px;border-radius:4px;background:#0e1428;border:1px solid #2b3866;overflow:hidden;margin-top:5px}
  .sexp>i{display:block;height:100%;background:linear-gradient(90deg,#8fd6ff,#6a8cff);width:0%}

  .li{background:linear-gradient(180deg,#172046,#121a34);border:1.4px solid #2b3866;
    border-radius:11px;padding:9px 10px;margin-bottom:6px}
  .li .lt{font-size:12px;font-weight:900}
  .li .ls{font-size:10.5px;color:#9fb0d4;font-weight:700;margin-top:3px;line-height:1.5}
  .li .lf{display:flex;justify-content:space-between;align-items:center;margin-top:7px;gap:8px}
  .li .lf span{font-size:10.5px;color:#a9bbe6;font-weight:800}
  .mini{padding:7px 13px;border-radius:8px;border:0;font-size:11px;font-weight:900;cursor:pointer;
    color:#06281a;background:linear-gradient(180deg,#9df0b0,#48c882);white-space:nowrap}
  .mini.gold{color:#2a2107;background:linear-gradient(180deg,#ffe07a,#f0a63c)}
  .mini:disabled{background:#26304e;color:#68738f;cursor:default}
  .qp{height:7px;border-radius:4px;background:#0e1428;overflow:hidden;margin-top:6px}
  .qp>i{display:block;height:100%;background:linear-gradient(90deg,#3fd0ff,#8b7bff)}

  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .day{border-radius:8px;background:#131b33;border:1.3px solid #2b3866;padding:4px 1px;text-align:center}
  .day .dn{font-size:8.5px;color:#8b9ac0;font-weight:800}
  .day .di{font-size:14px;line-height:16px}
  .day .dv{font-size:8px;font-weight:900;color:#cfe0ff}
  .day.got{opacity:.35}
  .day.today{border-color:#ffd45e;box-shadow:0 0 8px rgba(255,212,94,.4)}

  .wheel{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:8px}
  .slot{border-radius:9px;background:#131b33;border:1.5px solid #2b3866;padding:7px 2px;text-align:center}
  .slot.hit{border-color:#ffd45e;background:#2e2410;box-shadow:0 0 12px rgba(255,212,94,.5)}
  .slot .si2{font-size:16px}
  .slot .sv{font-size:9px;font-weight:900;color:#cfe0ff;margin-top:2px}

  #modal{position:absolute;inset:0;background:rgba(4,6,14,.86);display:none;align-items:center;
    justify-content:center;padding:22px;z-index:30}
  #modal.on{display:flex}
  .mbox{width:100%;max-height:640px;overflow-y:auto;border-radius:16px;padding:16px;text-align:center;
    background:linear-gradient(180deg,#1c2650,#131a34);border:2px solid #6d80c8;
    box-shadow:0 0 30px rgba(90,140,255,.3)}
  .mbox::-webkit-scrollbar{width:5px}
  .mbox::-webkit-scrollbar-thumb{background:#2a3357;border-radius:3px}
  .mbox h2{font-size:17px;margin-bottom:9px}
  .mbox p{font-size:12px;color:#9fb0d4;line-height:1.7;font-weight:700}
  .mbox p b{color:#ffd45e}
  .mrow{display:flex;gap:6px;margin-top:9px}
  .mrow>*{flex:1}
  .mbox .gbtn{margin-top:8px}

  .sumhead{border-radius:11px;padding:8px;margin-bottom:8px;font-size:12.5px;font-weight:900}
  .cards{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:8px}
  .rc{position:relative;border-radius:9px;padding:6px 2px 5px;border:1.6px solid #333;overflow:hidden;
    animation:pop .25s ease-out both}
  .rc .rg{font-size:8px;font-weight:900;margin-top:1px}
  .rc .rn{font-size:8px;color:#c3cfe8;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rc .new{position:absolute;top:1px;left:1px;background:#ff3b5c;color:#fff;font-size:7px;
    font-weight:900;border-radius:4px;padding:0 3px}
  .rc.hi{box-shadow:0 0 12px rgba(255,190,90,.8)}
  @keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}

  #loading{position:absolute;inset:0;background:#0b0d18;display:flex;align-items:center;
    justify-content:center;z-index:40;font-size:14px;font-weight:800;color:#8ea0c7}
  #loading.off{display:none}
</style>
</head>
<body>
<div id="wrap"><div id="app">
<div id="legacy">

  <div id="top">
    <div class="prof" id="profBtn">
      <div class="pface">🛡️<b id="plvN">Lv.1</b></div>
      <div class="pinfo">
        <div class="pcp">⚔️ <span id="cpN">0</span></div>
        <div class="pexp"><i id="pexpF"></i></div>
        <div class="prank"><span id="rankIc">🥉</span> <span id="rankN">브론즈</span></div>
      </div>
    </div>
    <div class="curs">
      <div class="crow">
        <div class="cbox cGold"><i>💰</i><b id="goldN">0</b></div>
        <div class="cbox cDia"><i>💎</i><b id="diaN">0</b><u data-go="shop">+</u></div>
      </div>
      <div class="crow">
        <div class="cbox cRel"><i>🔮</i><b id="relN">0</b><u data-go="shop">+</u></div>
        <div class="cbox"><i>🏆</i><b id="collN">0/49</b></div>
      </div>
    </div>
  </div>

  <div id="stagearea">
    <canvas id="view" width="540" height="372"></canvas>
    <div id="stinfo">
      <div class="chap" id="chapN">1-1 <em>스테이지</em></div>
      <div class="kbar"><i id="prF"></i><span id="prT"></span></div>
    </div>
    <div class="side" id="sideL">
      <div class="ibtn" data-pop="attend"><span class="si">📅</span><span class="sl">출석</span><span class="bdg">!</span></div>
      <div class="ibtn" data-pop="roul"><span class="si">🎰</span><span class="sl">룰렛</span><span class="bdg">!</span></div>
      <div class="ibtn" data-pop="mail"><span class="si">📬</span><span class="sl">우편</span><span class="bdg">!</span></div>
    </div>
    <div class="side" id="sideR">
      <div class="ibtn" data-pop="quest"><span class="si">📜</span><span class="sl">퀘스트</span><span class="bdg">!</span></div>
      <div class="ibtn" data-pop="dun"><span class="si">🏰</span><span class="sl">던전</span><span class="bdg">!</span></div>
      <div class="ibtn" data-pop="promo"><span class="si">🏅</span><span class="sl">승급전</span><span class="bdg">!</span></div>
    </div>
    <div id="battlefoot">
      <div id="hpwrap"><i id="hpF"></i><span id="hpT"></span></div>
      <div id="slots"></div>
    </div>
  </div>

  <div id="tuto">
    <div class="tinfo">
      <div class="tt">📌 <span id="tutoName">튜토리얼</span></div>
      <div class="tp"><i id="tutoBar"></i></div>
      <div class="tsub" id="tutoSub">0 / 1</div>
    </div>
    <button class="tbtn" id="tutoBtn">진행중</button>
  </div>

  <div id="panel">
    <div class="body on" id="bUp"></div>
    <div class="body" id="bSk"></div>
    <div class="body" id="bEq"></div>
    <div class="body" id="bPet"></div>
    <div class="body" id="bRel"></div>
    <div class="body" id="bShop"></div>
    <div class="body" id="bDun"></div>
    <div class="body" id="bSt"></div>
  </div>

  <div id="tabbar">
    <div class="tab on" data-t="up"><span class="ti">⚒️</span><span class="tl">강화</span><i class="bdg"></i></div>
    <div class="tab" data-t="sk"><span class="ti">📜</span><span class="tl">스킬</span><i class="bdg"></i></div>
    <div class="tab" data-t="eq"><span class="ti">⚔️</span><span class="tl">장비</span><i class="bdg"></i></div>

/* ---------------- 유틸 ---------------- */
const SUF = ['','K','M','B','T'];
for(let i=0;i<26;i++) for(let j=0;j<26;j++) SUF.push(String.fromCharCode(97+i)+String.fromCharCode(97+j));
function fmt(n){
  if(!isFinite(n)) return '∞';
  if(n < 1000) return n < 10 ? (Math.round(n*10)/10).toString() : Math.floor(n).toString();
  let i = 0;
  while(n >= 1000 && i < SUF.length-1){ n /= 1000; i++; }
  return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : Math.floor(n)) + SUF[i];
}
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;

  app.style.height = frameH + 'px';

}

const ATLAS = window.ATLAS || {};
const tileImg = new Image();
let tileOK = false;

function loadAtlases(done){
  const keys = Object.keys(ATLAS);
  let left = keys.length + 1;
  const tick = () => { if(--left === 0) done(); };
  keys.forEach(k => {
    const A = ATLAS[k], im = new Image();
    im.onload  = () => { A.image = im; tick(); };
    im.onerror = () => { A.broken = true; tick(); };
    im.src = A.img;
  });
  tileImg.onload  = () => { tileOK = true; tick(); };
  tileImg.onerror = () => { tileOK = false; tick(); };
  tileImg.src = 'assets/buch-dungeon-tileset.png';
}

/* 색조 변형 스프라이트 (펫 색상 변주) */
const tintCache = {};
function tinted(key, color){
  if(!color) return ATLAS[key] && ATLAS[key].image;
  const ck = key + color;
  if(tintCache[ck]) return tintCache[ck];
  const A = ATLAS[key];
  if(!A || !A.image) return null;
  const c = document.createElement('canvas');
  c.width = A.image.width; c.height = A.image.height;
  const g = c.getContext('2d');
  g.drawImage(A.image, 0, 0);
  g.globalCompositeOperation = 'multiply';
  g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
  g.globalCompositeOperation = 'destination-in';
  g.drawImage(A.image, 0, 0);
  tintCache[ck] = c;
  return c;
}

/* 프레임 그리기 (기준점 = 발밑) */
function drawFrame(key, frameName, x, y, scale, flip, alpha, img){
  const A = ATLAS[key];
  if(!A) return false;
  const src = img || A.image;
  if(!src) return false;
  const fr = A.f[frameName];
  if(!fr) return false;
  ctx.save();
  if(alpha !== undefined && alpha < 1) ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  if(flip) ctx.scale(-1, 1);
  ctx.drawImage(src, fr[0], fr[1], fr[2], fr[3],
    -fr[6]*scale/2 + fr[4]*scale, -fr[7]*scale + fr[5]*scale, fr[2]*scale, fr[3]*scale);
  ctx.restore();
  return true;
}
/* 중앙 기준 (펫·이펙트) */
function drawFrameC(key, frameName, x, y, scale, flip, alpha, img){
  const A = ATLAS[key];
  if(!A) return false;
  const src = img || A.image;
  if(!src) return false;
  const fr = A.f[frameName];
  if(!fr) return false;
  ctx.save();
  if(alpha !== undefined && alpha < 1) ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  if(flip) ctx.scale(-1, 1);
  ctx.drawImage(src, fr[0], fr[1], fr[2], fr[3],
    -fr[6]*scale/2 + fr[4]*scale, -fr[7]*scale/2 + fr[5]*scale, fr[2]*scale, fr[3]*scale);
  ctx.restore();
  return true;
}
function setAnim(e, key, name, fps, loop){
  if(e.anim === name && e.akey === key) return;
  e.akey = key; e.anim = name; e.at = 0; e.afps = fps; e.aloop = loop; e.adone = false;
}
function stepAnim(e, dt){
  const A = ATLAS[e.akey];
  if(!A) return;
  const list = A.a[e.anim];
  if(!list || !list.length) return;
  e.at += dt*e.afps;
  if(!e.aloop && e.at >= list.length){ e.at = list.length - 0.001; e.adone = true; }
}
function curFrame(e){
  const A = ATLAS[e.akey];
  if(!A) return null;
  const list = A.a[e.anim];
  if(!list || !list.length) return null;
  return list[e.aloop ? (Math.floor(e.at) % list.length) : Math.min(Math.floor(e.at), list.length-1)];
}

const WORLD = { w: 20*T, h: 32*T };

let floorCv = null;

function buildFloor(seed){
  const cols = Math.ceil(WORLD.w/T), rows = Math.ceil(WORLD.h/T);
  floorCv = document.createElement('canvas');
  floorCv.width = cols*T; floorCv.height = rows*T;
  const f = floorCv.getContext('2d');
  f.imageSmoothingEnabled = false;
  let s = (seed*2654435761) % 233280;
  const R = () => { s = (s*9301 + 49297) % 233280; return s/233280; };

  if(!tileOK){
    f.fillStyle = '#2b2440'; f.fillRect(0, 0, floorCv.width, floorCv.height);
    f.fillStyle = 'rgba(255,255,255,.03)';
    for(let y=0;y<rows;y++) for(let x=0;x<cols;x++) if((x+y)%2===0) f.fillRect(x*T, y*T, T, T);
  }else{
    for(let y=0;y<rows;y++){
      for(let x=0;x<cols;x++){
        const detail = R() < 0.16;
        const c = 6 + Math.floor(R()*7);
        const r = detail ? 2 + Math.floor(R()*2) : Math.floor(R()*2);
        f.drawImage(tileImg, c*TS, r*TS, TS, TS, x*T, y*T, T, T);
      }
    }
    for(let i=0;i<70;i++){
      f.globalAlpha = 0.10 + R()*0.10;
      f.fillStyle = R() < 0.5 ? '#241a3a' : '#3b2b46';
      f.beginPath();
      f.ellipse(R()*floorCv.width, R()*floorCv.height, T*(0.5+R()*1.1), T*(0.3+R()*0.7), R()*3.14, 0, 6.283);
      f.fill();
    }
    f.globalAlpha = 1;
  }
  f.fillStyle = 'rgba(14,16,42,.38)';
  f.fillRect(0, 0, floorCv.width, floorCv.height);
}

/* ==========================================================================
   보유 · 장착 · 배율
   ========================================================================== */
const has  = id => !!S.own[id];
const oLv  = id => (S.own[id] ? S.own[id].l : 0);
const frag = id => (S.own[id] ? S.own[id].n : 0);
const ownedIn = list => list.filter(x => has(x.id)).length;
const ownedTotal = () => Object.keys(S.own).length;
const skillEquipped = id => S.eqSkill.indexOf(id) >= 0;
const petEquipped   = id => S.eqPet.indexOf(id) >= 0;
const relicEquipped = id => S.eqRelic.indexOf(id) >= 0;
const eqEquipped    = it => S.eqSlot[it.slot] === it.id;
const gMul  = g => GRADE[g].mul;
const lvMul = l => 1 + l*0.18;
const ownVal   = it => 0.02 * gMul(it.g) * lvMul(oLv(it.id));
const equipVal = it => 0.10 * gMul(it.g) * lvMul(oLv(it.id));
const relicVal = it => it.v * gMul(it.g) * lvMul(oLv(it.id)) * 0.5;

let bonusCache = null, bonusDirty = true;
const markDirty = () => { bonusDirty = true; };
function bonus(){
  if(!bonusDirty && bonusCache) return bonusCache;
  const b = { atk:1, hp:1, regen:1, gold:1, rate:1, pet:1, cdmg:0, crit:0 };

  SKILLS.forEach(s => { if(has(s.id)) b.atk *= 1 + ownVal(s); });
  PETS.forEach(p => { if(has(p.id)){ b.atk *= 1 + ownVal(p)*0.6; b.gold *= 1 + ownVal(p); } });
  EQUIPS.forEach(e => {
    if(!has(e.id)) return;
    const v = 1 + ownVal(e);
    if(e.slot === 'weapon') b.atk *= v; else if(e.slot === 'shield') b.hp *= v; else b.regen *= v;
  });
  SLOTS.forEach(s => {
    const id = S.eqSlot[s.k];
    if(!id || !has(id)) return;
    const v = 1 + equipVal(EQ[id]);
    if(s.k === 'weapon') b.atk *= v; else if(s.k === 'shield') b.hp *= v; else b.regen *= v;
  });
  /* 유물: 보유 = 절반 효과, 장착 = 전체 효과 */
  RELICS.forEach(r => {
    if(!has(r.id)) return;
    const v = relicVal(r) * (relicEquipped(r.id) ? 2 : 1);
    if(r.eff === 'all'){ b.atk *= 1+v; b.hp *= 1+v; b.regen *= 1+v; b.gold *= 1+v; }
    else if(r.eff === 'crit') b.crit += v;
    else if(r.eff === 'rate') b.rate *= 1+v;
    else b[r.eff] *= 1+v;
  });
  /* 아바타: 보유한 모든 아바타 효과 합산 */
  AVATARS.forEach(a => {
    if(!S.avatars[a.id]) return;
    b.atk *= 1+a.atk; b.hp *= 1+a.hp; b.gold *= 1+a.gold;
  });
  /* 컬렉션 보너스 */
  Object.keys(COLL).forEach(k => { for(let i=0;i<S.coll[k];i++) COLL[k].tiers[i].f(b); });
  /* 계급 보너스 (승급전) */
  const rb = 1 + S.rank*0.25;
  b.atk *= rb; b.hp *= rb;
  /* 스탯 포인트 분배 보너스 */
  b.atk *= 1 + (S.spAtk|0)*SP_VALUE;
  b.hp  *= 1 + (S.spHp|0)*SP_VALUE;

  bonusCache = b; bonusDirty = false;
  return b;
}
const mulAtk   = () => bonus().atk;
const mulHp    = () => bonus().hp;
const mulRegen = () => bonus().regen;
const mulGold  = () => bonus().gold;
const mulRate  = () => bonus().rate;

const lv = id => S.lv[id] | 0;
const stat = {
  get dmg(){ return U.atk.val(lv('atk')) * mulAtk(); },
  get rate(){ return U.aspd.val(lv('aspd')) * mulRate(); },
  get crit(){ return Math.min(0.95, U.crit.val(lv('crit')) + bonus().crit); },
  get cdmg(){ return U.cdmg.val(lv('cdmg')) + bonus().cdmg; },
  get pierce(){ return U.pierce.val(lv('pierce')); },
  get maxHp(){ return U.hp.val(lv('hp')) * mulHp(); },
  get regen(){ return U.regen.val(lv('regen')) * mulRegen(); },
  get defMul(){ return U.def.val(lv('def')); },
  get speed(){ return U.spd.val(lv('spd')); },
  get goldMul(){ return U.gold.val(lv('gold')) * mulGold(); },
  get critMul(){ return 1 + this.crit*(this.cdmg-1); },
  get dps(){
    let d = 0;
    S.eqSkill.forEach(id => {
      const s = SK[id];
      if(!s) return;
      const dmg = skillDmg(s);
      const hits = s.id === 'shuri' ? 8 : s.id === 'bolt' ? 3
                 : s.id === 'multi' ? Math.min(3 + Math.floor(oLv('multi')/2), 9) : 1;
      d += s.cd > 0 ? dmg*hits/(s.cd/Math.max(0.35, this.rate/1.4)) : dmg*3;
    });
    S.eqPet.forEach(id => { const p = PT[id]; if(p) d += petDmg(p)/p.cd; });
    return d * this.critMul;
  }
};
const skillDmg = s => stat.dmg * s.m * gMul(s.g) * lvMul(oLv(s.id));
const petDmg   = p => stat.dmg * p.m * gMul(p.g) * lvMul(oLv(p.id)) * bonus().pet;
/* 캐릭터 레벨 */
const plvNeed = l => Math.floor(30 * Math.pow(1.135, l-1));
const SP_PER_LV = 3;          /* 레벨업당 스탯 포인트 */
const SP_VALUE  = 0.02;       /* 포인트 1당 +2% */
function gainExp(n){
  S.pexp += n;
  let up = 0;
  while(S.pexp >= plvNeed(S.plv) && up < 500){ S.pexp -= plvNeed(S.plv); S.plv++; up++; }
  if(up){
    S.sp += up*SP_PER_LV;
    if(S.spAuto) autoSpend();
    markDirty(); uiDirty = true;
    player.hp = Math.min(stat.maxHp, player.hp + stat.maxHp*0.3);
  }
  return up;
}
/* 스탯 분배 */
function addStat(k, n){
  n = Math.min(n, S.sp);
  if(n <= 0) return 0;
  const before = k === 'hp' ? stat.maxHp : 0;
  S.sp -= n;
  if(k === 'atk') S.spAtk += n; else S.spHp += n;
  markDirty(); uiDirty = true;
  if(k === 'hp') player.hp += stat.maxHp - before;
  save();
  return n;
}
/* 자동 분배: 공격 2 : 체력 1 */
function autoSpend(){
  while(S.sp > 0){
    const total = S.spAtk + S.spHp;
    if(S.spAtk <= total*2/3) { S.spAtk++; } else { S.spHp++; }
    S.sp--;
  }
  markDirty(); uiDirty = true;
}
function resetStat(){
  const cost = 500;
  const total = S.spAtk + S.spHp;
  if(total <= 0){ popup('초기화 불가', '<p>분배한 스탯 포인트가 없습니다.</p>'); return; }
  if(S.dia < cost){ popup('💎 다이아 부족', '<p>스탯 초기화에는 다이아 <b>💎' + cost + '</b>가 필요합니다.</p>'); return; }
  S.dia -= cost; S.sp += total; S.spAtk = 0; S.spHp = 0;
  markDirty(); uiDirty = true; save();
  popup('🔄 스탯 초기화', '<p>포인트 <b>' + total + '</b>개를 돌려받았습니다.<br>다시 분배해 보세요!</p>');
}

/* 전투력 */
const cp = () => Math.round(stat.dps*1.2 + stat.maxHp*0.6 + stat.regen*80 + stat.dmg*3);
const rankOf = () => RANKS[Math.min(S.rank, RANKS.length-1)];
const nextRank = () => (S.rank+1 < RANKS.length ? RANKS[S.rank+1] : null);
const canPromote = () => { const r = nextRank(); return !!r && S.best >= r.stage && cp() >= r.cp; };

/* ==========================================================================
   전투 상태
   ========================================================================== */
const player = {
  x: WORLD.w/2, y: WORLD.h/2, r: 16, hp: 1, vx: 0, vy: 0,
  aim: -Math.PI/2, flip: false, dead: 0, hitFx: 0, atkFx: 0, inv: 0,
  akey:'knight', anim:'idle', at:0, afps:8, aloop:true, adone:false
};
let enemies = [], shots = [], parts = [], nums = [], corpses = [], zones = [], booms = [], bolts = [];
let pets = [], spawnQ = [], skillCd = {};
let killed = 0, msgTxt = '', msgT = 0, orbitAng = 0, auraTick = 0;
let promo = null;   /* 승급전 진행 상태 */
let goldEMA = 0, goldWin = 0, winT = 0;

function showMsg(t){ msgTxt = t; msgT = 1.7; }

function syncPets(){
  pets = S.eqPet.filter(id => PT[id]).map((id, i) => {
    const p = PT[id], sp = PET_SP[p.sp];
    return { def:p, sp, i, x:player.x, y:player.y, cd:rnd(0,0.6), flip:false,
             akey:p.sp, anim:sp.anim, at:Math.random()*5, afps:sp.fps, aloop:true, adone:false };
  });
}

function spawnStage(){
  enemies.length = 0; shots.length = 0; parts.length = 0; nums.length = 0;
  corpses.length = 0; zones.length = 0; booms.length = 0; bolts.length = 0; spawnQ.length = 0;
  killed = 0;
  const s = S.stage, boss = (s % 10 === 0);
  buildFloor(s);
  for(let i=0;i<ENEMY_COUNT;i++){
    let t = 'zombie';
    const r = Math.random();
    if(s >= 3 && r < 0.44) t = 'goblin';
    else if(s >= 5 && r > 0.84) t = 'dark';
    spawnQ.push({ t, delay: i*0.02 + rnd(0, 0.3) });
  }
  if(boss) spawnQ.push({ t:'boss', delay:1.4 });
  player.x = WORLD.w/2; player.y = WORLD.h/2;
  player.hp = stat.maxHp; player.dead = 0;
  cam.x = player.x; cam.y = player.y;
  syncPets();
  showMsg(boss ? '⚠ BOSS STAGE ' + s : 'STAGE ' + s);
}

function makeEnemy(tk){
  const T2 = ETYPE[tk], s = S.stage;
  let x, y, tries = 0;
  do{ x = rnd(60, WORLD.w-60); y = rnd(60, WORLD.h-60); tries++; }
  while(Math.hypot(x-player.x, y-player.y) < 250 && tries < 40);
  const hp = eHp(s) * T2.hp;
  enemies.push({
    tk, T:T2, x, y, r:T2.r, hp, max:hp,
    dmg: eDmg(s)*T2.dmg, gold: eGold(s)*T2.gold,
    sp: (110 + 3*s*0.2) * T2.sp * rnd(0.9, 1.1),
    cd: rnd(0, 0.6), born:0, fx:0, kx:0, ky:0, ph:Math.random()*6.28, flip:false, slow:0,
    akey:T2.atlas, anim:T2.walk, at:Math.random()*4, afps:T2.fps, aloop:true, adone:false, atkT:0
  });
}

/* ---------------- 이펙트 ---------------- */
function burst(x, y, c, n, pw){
  for(let i=0;i<n;i++){
    if(parts.length > 320) break;
    const a = Math.random()*6.283, v = rnd(40, pw);
    parts.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:rnd(.25,.6), t:0, c, r:rnd(1.4,3.6) });
  }
}
function dmgNum(x, y, v, crit){
  if(nums.length > 44) nums.shift();
  nums.push({ x, y, v:fmt(v), t:0, crit, vy:-46, ox:rnd(-9,9) });
}
function hitEnemy(e, dmg, crit, kx, ky){
  e.hp -= dmg; e.fx = 0.12; e.kx += kx || 0; e.ky += ky || 0;
  dmgNum(e.x, e.y - e.r*2.6, dmg, crit);
  if(e.hp <= 0) killEnemy(e);
}
function killEnemy(e){
  const i = enemies.indexOf(e);
  if(i < 0) return;
  enemies.splice(i, 1);
  const g = e.gold * stat.goldMul;
  S.gold += g; goldWin += g; S.totalKills++; killed++;
  gainExp(2 + S.stage*0.5 + (e.tk === 'boss' ? 80 : 0));
  if(e.tk === 'boss' && S.stage >= S.best) S.dia += 250 + S.stage*25;
  burst(e.x, e.y - e.r, e.T.col, e.tk === 'boss' ? 46 : 13, e.tk === 'boss' ? 330 : 190);
  if(e.tk === 'boss') cam.shake = 12;
  corpses.push({ akey:e.T.atlas, anim:e.T.die, at:0, afps:10, aloop:false,
                 x:e.x, y:e.y, scale:e.T.scale, flip:e.flip, life:1.6, col:e.T.col, r:e.r });
}
function nearest(x, y, maxD){
  let best = null, bd = maxD ? maxD*maxD : Infinity;
  for(const e of enemies){
    if(e.born < 0.3) continue;
    const d = (e.x-x)*(e.x-x) + (e.y-y)*(e.y-y);
    if(d < bd){ bd = d; best = e; }
  }
  return best;
}
function areaDamage(x, y, r, dmg, col){
  const crit = Math.random() < stat.crit;
  const d = dmg * (crit ? stat.cdmg : 1);
  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    if(e.born < 0.3) continue;
    const ex = e.x-x, ey = (e.y - e.r) - y;
    if(ex*ex + ey*ey < (r+e.r)*(r+e.r)) hitEnemy(e, d, crit, ex*0.4, ey*0.4);
  }
  burst(x, y, col || '#ffd08a', 12, 220);
}

/* ---------------- 스킬 발동 ---------------- */
function castSkill(s){
  const dmg = skillDmg(s);
  const px = player.x, py = player.y - 22;
  switch(s.id){
    case 'slash': {
      const tg = nearest(px, py);
      if(!tg) return false;
      const a = Math.atan2(tg.y - tg.r - py, tg.x - px);
      shots.push({ k:'slash', x:px, y:py, vx:Math.cos(a)*620, vy:Math.sin(a)*620, a,
                   dmg, life:1.15, pierce:stat.pierce, hit:[], col:'#dff2ff' });
      player.atkFx = 0.22;
      return true;
    }
    case 'multi': {
      const tg = nearest(px, py);
      if(!tg) return false;
      const base = Math.atan2(tg.y - tg.r - py, tg.x - px);
      const n = Math.min(3 + Math.floor(oLv('multi')/2), 9);
      for(let i=0;i<n;i++){
        const a = base + (i-(n-1)/2)*0.19;
        shots.push({ k:'slash', x:px, y:py, vx:Math.cos(a)*600, vy:Math.sin(a)*600, a,
                     dmg, life:1.15, pierce:stat.pierce, hit:[], col:'#bfe0ff' });
      }
      player.atkFx = 0.22;
      return true;
    }
    case 'shuri': {
      if(!nearest(px, py)) return false;
      for(let i=0;i<8;i++){
        const a = i*0.785 + orbitAng*0.3;
        shots.push({ k:'shuri', x:px, y:py, vx:Math.cos(a)*430, vy:Math.sin(a)*430, a,
                     dmg, life:1.4, pierce:stat.pierce, hit:[], col:'#cfd8ff', spin:0 });
      }
      return true;
    }
    case 'ice': {
      const tg = nearest(px, py);
      if(!tg) return false;
      const a = Math.atan2(tg.y - tg.r - py, tg.x - px);
      shots.push({ k:'ice', x:px, y:py, vx:Math.cos(a)*760, vy:Math.sin(a)*760, a,
                   dmg, life:1.3, pierce:stat.pierce + 4, hit:[], col:'#9fe8ff', slow:0.45 });
      return true;
    }
    case 'bolt': {
      let n = 0;
      for(let i=0;i<3;i++){
        const list = enemies.filter(e => e.born >= 0.3);
        if(!list.length) break;
        const e = list[Math.floor(Math.random()*list.length)];
        const crit = Math.random() < stat.crit;
        bolts.push({ x1:px, y1:py, x2:e.x, y2:e.y - e.r, t:0 });
        hitEnemy(e, dmg*(crit?stat.cdmg:1), crit, 0, 0);
        burst(e.x, e.y - e.r, '#bfe4ff', 7, 190);
        n++;
      }
      return n > 0;
    }
    case 'boom': {
      const tg = nearest(px, py);
      if(!tg) return false;
      const a = Math.atan2(tg.y - tg.r - py, tg.x - px);
      shots.push({ k:'boom', x:px, y:py, vx:Math.cos(a)*380, vy:Math.sin(a)*380, a,
                   dmg, life:2.0, pierce:1, hit:[], col:'#ffb45c', r:78 });
      return true;
    }
    case 'poison': {
      const tg = nearest(px, py) || { x:px, y:py, r:0 };
      zones.push({ k:'poison', x:tg.x, y:tg.y - tg.r*0.5, r:92, dps:dmg, life:5.0, t:0, tick:0 });
      return true;
    }
    case 'drain': {
      const tg = nearest(px, py, 420);
      if(!tg) return false;
      const crit = Math.random() < stat.crit;
      const d = dmg*(crit?stat.cdmg:1);
      hitEnemy(tg, d, crit, 0, 0);
      const heal = Math.min(stat.maxHp*0.05, d*0.25);
      player.hp = Math.min(stat.maxHp, player.hp + heal);
      bolts.push({ x1:tg.x, y1:tg.y - tg.r, x2:px, y2:py, t:0, col:'#ff6b8a' });
      burst(px, py, '#ff9ab0', 8, 150);
      return true;
    }
    case 'boomer': {
      const tg = nearest(px, py);
      if(!tg) return false;
      const a = Math.atan2(tg.y - tg.r - py, tg.x - px);
      shots.push({ k:'boomer', x:px, y:py, vx:Math.cos(a)*520, vy:Math.sin(a)*520, a,
                   dmg, life:2.4, pierce:99, hit:[], col:'#ffe08a', back:0, spin:0 });
      return true;
    }
    case 'meteor': {
      const tg = nearest(px, py, 600) || { x:px + rnd(-180,180), y:py + rnd(-180,180), r:0 };
      const mx = tg.x + rnd(-40,40), my = tg.y + rnd(-40,40);
      shots.push({ k:'meteor', x:mx, y:my - 420, vx:rnd(-40,40), vy:900, a:1.57,
                   dmg, life:1.2, pierce:1, hit:[], col:'#ff9a5c', r:130, tx:mx, ty:my });
      return true;
    }
    case 'holy': {
      if(!nearest(px, py, 400)) return false;
      areaDamage(px, py, 190, dmg, '#fff2b0');
      booms.push({ x:px, y:py, at:0, afps:26, aloop:false, akey:'boom', anim:'boom', scale:3.4, alpha:0.85 });
      cam.shake = Math.max(cam.shake, 6);
      return true;
    }
  }
  return false;
}

/* ==========================================================================
   시뮬레이션
   ========================================================================== */
function step(dt){
  for(let i=spawnQ.length-1;i>=0;i--){
    spawnQ[i].delay -= dt;
    if(spawnQ[i].delay <= 0){ makeEnemy(spawnQ[i].t); spawnQ.splice(i,1); }
  }
  const maxHp = stat.maxHp;

  /* ---- 플레이어 ---- */
  if(player.dead > 0){
    player.dead -= dt;
    setAnim(player, 'knight', 'die', 8, false);
    if(player.dead <= 0){
      player.hp = maxHp; player.hitFx = 0; player.inv = 1.2;
      burst(player.x, player.y - 20, '#7fd0ff', 28, 230);
      setAnim(player, 'knight', 'idle', 8, true);
    }
  }else{
    player.hp = Math.min(maxHp, player.hp + stat.regen*dt);
    if(player.hitFx > 0) player.hitFx -= dt;
    if(player.atkFx > 0) player.atkFx -= dt;
    if(player.inv > 0) player.inv -= dt;

    const tg = nearest(player.x, player.y);
    let td = tg ? Math.hypot(tg.x-player.x, tg.y-player.y) : 0;
    let mx = 0, my = 0;
    if(tg){
      const dx = (tg.x-player.x)/td, dy = (tg.y-player.y)/td;
      const want = 135;
      if(td > want + 30){ mx += dx; my += dy; }
      else if(td < want - 25){ mx -= dx*1.2; my -= dy*1.2; }
      player.aim = Math.atan2(dy, dx);
      player.flip = Math.cos(player.aim) > 0;   /* 기사 원본은 왼쪽을 봄 */
    }
    for(const e of enemies){
      const dx = player.x-e.x, dy = player.y-e.y;
      const d = Math.hypot(dx, dy) || 1;
      if(d < 115){ const w = (115-d)/115; mx += dx/d*w*1.7; my += dy/d*w*1.7; }
    }
    const m = 150;
    if(player.x < m) mx += (m-player.x)/m*2.4;
    if(player.x > WORLD.w-m) mx -= (player.x-(WORLD.w-m))/m*2.4;
    if(player.y < m) my += (m-player.y)/m*2.4;
    if(player.y > WORLD.h-m) my -= (player.y-(WORLD.h-m))/m*2.4;

    const ml = Math.hypot(mx, my), sp = stat.speed;
    if(ml > 0.02){
      player.vx += ((mx/ml)*sp - player.vx) * Math.min(1, dt*9);
      player.vy += ((my/ml)*sp - player.vy) * Math.min(1, dt*9);
    }else{
      player.vx *= Math.pow(0.002, dt); player.vy *= Math.pow(0.002, dt);
    }
    player.x = clamp(player.x + player.vx*dt, 24, WORLD.w-24);
    player.y = clamp(player.y + player.vy*dt, 30, WORLD.h-16);

    /* ---- 장착 스킬 자동 발동 ---- */
    const rateMul = stat.rate/1.4;
    for(const id of S.eqSkill){
      const s = SK[id];
      if(!s || s.cd <= 0) continue;
      if(skillCd[id] === undefined) skillCd[id] = rnd(0, 0.4);
      skillCd[id] -= dt;
      let guard = 0;
      while(skillCd[id] <= 0 && guard++ < 4){
        if(!castSkill(s)){ skillCd[id] = 0.25; break; }
        skillCd[id] += s.cd / Math.max(0.35, rateMul);
      }
    }

    const moving = Math.hypot(player.vx, player.vy) > 25;
    if(player.atkFx > 0)      setAnim(player, 'knight', 'attack_A', 16, false);
    else if(player.hitFx > 0) setAnim(player, 'knight', 'get_hit', 12, false);
    else if(moving)           setAnim(player, 'knight', 'run', 14, true);
    else                      setAnim(player, 'knight', 'idle', 8, true);
  }
  stepAnim(player, dt);

  /* ---- 회전검 (지속 스킬) ---- */
  if(skillEquipped('orbit') && has('orbit') && player.dead <= 0){
    orbitAng += dt*2.4;
    const s = SK.orbit;
    const cnt = Math.min(2 + Math.floor(oLv('orbit')/2), 8), R = 78, od = skillDmg(s);
    for(let i=0;i<cnt;i++){
      const a = orbitAng + i*(6.283/cnt);
      const bx = player.x + Math.cos(a)*R, by = player.y - 22 + Math.sin(a)*R*0.75;
      for(let j=enemies.length-1;j>=0;j--){
        const e = enemies[j];
        if(e.born < 0.3 || (e.orbCd || 0) > 0) continue;
        const dx = bx-e.x, dy = by-(e.y-e.r);
        if(dx*dx + dy*dy < (e.r+16)*(e.r+16)){
          e.orbCd = 0.3;
          const crit = Math.random() < stat.crit;
          hitEnemy(e, od*(crit?stat.cdmg:1), crit, Math.cos(a)*70, Math.sin(a)*70);
          burst(bx, by, '#ffd9a0', 4, 120);
        }
      }
    }
  } else orbitAng += dt*2.4;

  /* ---- 신성 오라 (지속 스킬) ---- */
  if(skillEquipped('aura') && has('aura') && player.dead <= 0){
    auraTick -= dt;
    if(auraTick <= 0){
      auraTick = 0.35;
      const R = 92 + 6*oLv('aura'), d = skillDmg(SK.aura)*0.35;
      for(let j=enemies.length-1;j>=0;j--){
        const e = enemies[j];
        if(e.born < 0.3) continue;
        const dx = e.x-player.x, dy = (e.y - e.r*0.7)-(player.y-20);
        if(dx*dx + dy*dy < R*R) hitEnemy(e, d, false, 0, 0);
      }
    }
  }

  /* ---- 펫 ---- */
  for(let i=0;i<pets.length;i++){
    const p = pets[i];
    const a = orbitAng*0.55 + i*(6.283/Math.max(1,pets.length));
    const tx = player.x + Math.cos(a)*62, ty = player.y - 46 + Math.sin(a)*30;
    p.x += (tx - p.x) * Math.min(1, dt*4.5);
    p.y += (ty - p.y) * Math.min(1, dt*4.5);
    stepAnim(p, dt);
    p.cd -= dt;
    const tgt = nearest(p.x, p.y, 460);
    if(tgt){
      p.flip = p.sp.faceRight ? (tgt.x < p.x) : (tgt.x > p.x);
      if(p.cd <= 0){
        p.cd = p.def.cd / Math.max(0.4, stat.rate/1.4);
        const ang = Math.atan2((tgt.y - tgt.r) - p.y, tgt.x - p.x);
        shots.push({ k:'pet', x:p.x, y:p.y, vx:Math.cos(ang)*560, vy:Math.sin(ang)*560, a:ang,
                     dmg: petDmg(p.def), life:1.1, pierce:1, hit:[], col:'#a6ffd8' });
      }
    }
  }

  /* ---- 적 ---- */
  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    e.born += dt;
    if(e.fx > 0) e.fx -= dt;
    if(e.orbCd > 0) e.orbCd -= dt;
    if(e.atkT > 0) e.atkT -= dt;
    if(e.slow > 0) e.slow -= dt;
    stepAnim(e, dt);
    if(e.born < 0.3) continue;

    const dx = player.x-e.x, dy = player.y-e.y;
    const d = Math.hypot(dx, dy) || 1;
    let ax = dx/d, ay = dy/d;
    const swirl = (e.ph % 2 < 1 ? 0.55 : -0.55) * clamp(d/220, 0.25, 1);
    ax += -dy/d*swirl; ay += dx/d*swirl;

    for(let j=0;j<enemies.length;j++){
      if(j === i) continue;
      const o = enemies[j];
      const ox = e.x-o.x, oy = e.y-o.y;
      const od = Math.hypot(ox, oy), md = e.r + o.r + 10;
      if(od > 0.01 && od < md){ const w = (md-od)/md; ax += ox/od*w*2.9; ay += oy/od*w*2.9; }
    }
    const al = Math.hypot(ax, ay) || 1;
    const spd = e.sp * (e.slow > 0 ? 0.55 : 1);
    e.x += ((ax/al)*spd + e.kx) * dt;
    e.y += ((ay/al)*spd + e.ky) * dt;
    e.kx *= Math.pow(0.02, dt); e.ky *= Math.pow(0.02, dt);
    e.x = clamp(e.x, e.r, WORLD.w-e.r);
    e.y = clamp(e.y, e.r, WORLD.h-e.r);
    e.flip = dx < 0;

    e.cd -= dt;
    if(player.dead <= 0 && d < e.r + player.r + 6 && e.cd <= 0){
      e.cd = 0.9; e.atkT = 0.45;
      setAnim(e, e.T.atlas, e.T.atk, 12, false);
      if(player.inv > 0) continue;
      player.inv = 0.4;
      player.hp -= e.dmg * stat.defMul;
      player.hitFx = 0.22;
      cam.shake = Math.min(9, cam.shake + 3.5);
      const a = Math.atan2(-dy, -dx);
      player.vx += Math.cos(a)*140; player.vy += Math.sin(a)*140;
      burst(player.x, player.y - 22, '#ff8090', 7, 160);
      if(player.hp <= 0){
        player.hp = 0; player.dead = 2.4;
        burst(player.x, player.y - 20, '#ff5470', 36, 320);
        cam.shake = 15; showMsg('부활 중...');
      }
    }
    if(e.atkT <= 0) setAnim(e, e.T.atlas, e.T.walk, e.T.fps, true);
  }

  /* ---- 투사체 ---- */
  for(let i=shots.length-1;i>=0;i--){
    const b = shots[i];
    b.life -= dt;
    if(b.spin !== undefined) b.spin += dt*16;

    if(b.k === 'boomer'){
      b.back += dt;
      if(b.back > 0.55){
        const ang = Math.atan2(player.y-22-b.y, player.x-b.x);
        b.vx += Math.cos(ang)*1900*dt; b.vy += Math.sin(ang)*1900*dt;
        if(Math.hypot(player.x-b.x, player.y-22-b.y) < 26){ shots.splice(i,1); continue; }
      }
      b.hit.length = 0;
    }
    b.x += b.vx*dt; b.y += b.vy*dt;

    if(b.k === 'meteor'){
      if(b.y >= b.ty){
        areaDamage(b.tx, b.ty, b.r, b.dmg, '#ffb45c');
        booms.push({ x:b.tx, y:b.ty, at:0, afps:24, aloop:false, akey:'boom', anim:'boom', scale:3.0, alpha:1 });
        cam.shake = Math.max(cam.shake, 8);
        shots.splice(i,1); continue;
      }
      continue;
    }
    if(b.life <= 0 || b.x < -60 || b.y < -60 || b.x > WORLD.w+60 || b.y > WORLD.h+60){
      if(b.k === 'boom'){
        areaDamage(b.x, b.y, b.r, b.dmg, '#ffb45c');
        booms.push({ x:b.x, y:b.y, at:0, afps:26, aloop:false, akey:'boom', anim:'boom', scale:2.2, alpha:1 });
      }
      shots.splice(i,1); continue;
    }

    for(let j=enemies.length-1;j>=0;j--){
      const e = enemies[j];
      if(e.born < 0.3 || b.hit.indexOf(e) >= 0) continue;
      const ex = e.x, ey = e.y - e.r;
      if((b.x-ex)*(b.x-ex) + (b.y-ey)*(b.y-ey) < (e.r+13)*(e.r+13)){
        b.hit.push(e);
        if(b.k === 'boom'){
          areaDamage(b.x, b.y, b.r, b.dmg, '#ffb45c');
          booms.push({ x:b.x, y:b.y, at:0, afps:26, aloop:false, akey:'boom', anim:'boom', scale:2.2, alpha:1 });
          cam.shake = Math.max(cam.shake, 5);
          shots.splice(i,1); break;
        }
        const crit = Math.random() < stat.crit;
        const dmg = b.dmg * (crit ? stat.cdmg : 1);
        burst(b.x, b.y, crit ? '#ffe27a' : b.col, crit ? 8 : 4, crit ? 210 : 120);
        if(b.slow) e.slow = b.slow;
        hitEnemy(e, dmg, crit, b.vx*0.05, b.vy*0.05);
        if(--b.pierce <= 0){ shots.splice(i,1); break; }
      }
    }
  }

  /* ---- 장판 ---- */
  for(let i=zones.length-1;i>=0;i--){
    const z = zones[i];
    z.t += dt; z.life -= dt; z.tick -= dt;
    if(z.tick <= 0){
      z.tick = 0.4;
      for(let j=enemies.length-1;j>=0;j--){
        const e = enemies[j];
        if(e.born < 0.3) continue;
        const dx = e.x-z.x, dy = (e.y-e.r)-z.y;
        if(dx*dx + dy*dy < z.r*z.r) hitEnemy(e, z.dps*0.4, false, 0, 0);
      }
      if(parts.length < 240) burst(z.x + rnd(-z.r*0.6, z.r*0.6), z.y + rnd(-z.r*0.4, z.r*0.4), '#8ce06a', 2, 40);
    }
    if(z.life <= 0) zones.splice(i,1);
  }
  /* ---- 폭발 / 번개 ---- */
  for(let i=booms.length-1;i>=0;i--){
    const b = booms[i];
    stepAnim(b, dt);
    if(b.adone) booms.splice(i,1);
  }
  for(let i=bolts.length-1;i>=0;i--){
    bolts[i].t += dt;
    if(bolts[i].t > 0.18) bolts.splice(i,1);
  }
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i]; p.t += dt;
    if(p.t >= p.life){ parts.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= Math.pow(0.08, dt); p.vy *= Math.pow(0.08, dt);
  }
  for(let i=nums.length-1;i>=0;i--){
    const n = nums[i]; n.t += dt; n.y += n.vy*dt; n.vy += 70*dt;
    if(n.t > 0.85) nums.splice(i,1);
  }
  for(let i=corpses.length-1;i>=0;i--){
    const c = corpses[i];
    stepAnim(c, dt); c.life -= dt;
    if(c.life <= 0) corpses.splice(i,1);
  }

  /* ---- 승급전 진행 ---- */
  if(promo){
    promo.t -= dt;
    if(!enemies.some(e => e.tk === 'promo')) endPromo(true);
    else if(promo.t <= 0) endPromo(false);
  }

  /* ---- 스테이지 클리어 ---- */
  if(!promo && enemies.length === 0 && spawnQ.length === 0 && player.dead <= 0){
    const first = S.stage >= S.best;              /* 최고 기록 갱신 시에만 다이아 */
    S.stage++;
    S.best = Math.max(S.best, S.stage);
    const bonusG = eGold(S.stage-1) * 12 * stat.goldMul;
    S.gold += bonusG; goldWin += bonusG;
    let msg = 'STAGE CLEAR! +' + fmt(bonusG) + 'G';
    if(first){
      const d = 35 + Math.floor(S.stage*3.6);
      S.dia += d; msg += '  💎+' + d;
    }
    spawnStage();
    showMsg(msg);
    uiDirty = true;
  }

  if(S.autoBuy) autoBuyTick(dt);
  if(S.autoEquip) autoEquipTick(dt);

  const tx = clamp(player.x, VW/2, WORLD.w-VW/2);
  const ty = clamp(player.y, VH/2, WORLD.h-VH/2);
  cam.x += (tx-cam.x) * Math.min(1, dt*6);
  cam.y += (ty-cam.y) * Math.min(1, dt*6);
  if(cam.shake > 0) cam.shake = Math.max(0, cam.shake - dt*28);
  if(msgT > 0) msgT -= dt;

  winT += dt;
  if(winT >= 1){ goldEMA = goldEMA*0.7 + (goldWin/winT)*0.3; goldWin = 0; winT = 0; }
}

/* ==========================================================================
   렌더
   ========================================================================== */
function drawShadow(x, y, w){
  ctx.globalAlpha = 0.34; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(x, y, w, w*0.4, 0, 0, 6.283); ctx.fill();
  ctx.globalAlpha = 1;
}
function draw(){
  const sx = cam.shake ? rnd(-cam.shake, cam.shake)*0.45 : 0;
  const sy = cam.shake ? rnd(-cam.shake, cam.shake)*0.45 : 0;
  const ox = -(cam.x - VW/2) + sx, oy = -(cam.y - VH/2) + sy;

  ctx.fillStyle = '#0a0c16'; ctx.fillRect(0, 0, VW, VH);
  ctx.save(); ctx.translate(ox, oy);

  if(floorCv) ctx.drawImage(floorCv, 0, 0);
  ctx.strokeStyle = 'rgba(10,8,20,.9)'; ctx.lineWidth = 10;
  ctx.strokeRect(-5, -5, WORLD.w+10, WORLD.h+10);
  ctx.strokeStyle = '#4a5a96'; ctx.lineWidth = 2;
  ctx.strokeRect(0, 0, WORLD.w, WORLD.h);

  /* 독 장판 */
  for(const z of zones){
    const a = clamp(z.life/1.2, 0, 1)*0.5;
    const g = ctx.createRadialGradient(z.x, z.y, z.r*0.2, z.x, z.y, z.r);
    g.addColorStop(0, 'rgba(120,230,110,' + (a*0.55) + ')');
    g.addColorStop(1, 'rgba(60,180,80,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(z.x, z.y, z.r, z.r*0.62, 0, 0, 6.283); ctx.fill();
  }
  /* 오라 */
  if(skillEquipped('aura') && has('aura') && player.dead <= 0){
    const R = (92 + 6*oLv('aura')) * (0.9 + 0.1*Math.sin(performance.now()/220));
    const g = ctx.createRadialGradient(player.x, player.y-20, R*0.2, player.x, player.y-20, R);
    g.addColorStop(0, 'rgba(255,170,80,.17)');
    g.addColorStop(1, 'rgba(255,90,40,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(player.x, player.y-20, R, 0, 6.283); ctx.fill();
    ctx.strokeStyle = 'rgba(255,180,90,.32)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(player.x, player.y-20, R, 0, 6.283); ctx.stroke();
  }

  for(const c of corpses){
    const a = Math.min(1, c.life/0.6);
    const fr = curFrame(c);
    drawShadow(c.x, c.y, c.r*0.85);
    if(!fr || !drawFrame(c.akey, fr, c.x, c.y, c.scale, c.flip, a*0.9)){
      ctx.globalAlpha = a*0.5; ctx.fillStyle = c.col;
      ctx.beginPath(); ctx.arc(c.x, c.y-c.r, c.r, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1;
    }
  }
  for(const p of parts){
    const a = 1 - p.t/p.life;
    ctx.globalAlpha = a; ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r*a + 0.5, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* 적 + 플레이어 깊이 정렬 */
  const order = enemies.slice();
  order.push(player);
  order.sort((a, b) => a.y - b.y);
  for(const o of order){
    if(o === player){
      drawShadow(player.x, player.y, 15);
      const fr = curFrame(player);
      const av = AV[S.avatar], aimg = av && av.tint ? tinted('knight', av.tint) : null;
      if(!fr || !drawFrame('knight', fr, player.x, player.y, 1.0, player.flip, 1, aimg)){
        ctx.save(); ctx.translate(player.x, player.y-18); ctx.rotate(player.aim);
        ctx.fillStyle = '#7fe6ff'; ctx.beginPath();
        ctx.moveTo(20,0); ctx.lineTo(-13,13); ctx.lineTo(-6,0); ctx.lineTo(-13,-13);
        ctx.closePath(); ctx.fill(); ctx.restore();
      }
      if(player.hitFx > 0 && fr){
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.5;
        drawFrame('knight', fr, player.x, player.y, 1.0, player.flip, 1, aimg);
        ctx.restore();
      }
      continue;
    }
    const e = o, T2 = e.T;
    const grow = e.born < 0.3 ? e.born/0.3 : 1;
    if(e.born < 0.3){
      ctx.globalAlpha = grow; ctx.strokeStyle = T2.col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y-e.r, e.r*(2.4-grow*1.4), 0, 6.283); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    drawShadow(e.x, e.y, e.r*0.85*grow);
    const fr = curFrame(e);
    const ok = fr && drawFrame(T2.atlas, fr, e.x, e.y, T2.scale*(0.4+0.6*grow), e.flip, grow);
    if(!ok){
      ctx.globalAlpha = grow; ctx.fillStyle = e.fx > 0 ? '#fff' : T2.col;
      ctx.beginPath(); ctx.arc(e.x, e.y-e.r, e.r*grow, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1;
    }else if(e.fx > 0){
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.55;
      drawFrame(T2.atlas, fr, e.x, e.y, T2.scale, e.flip, 1);
      ctx.restore();
    }
    if(e.slow > 0){
      ctx.globalAlpha = 0.35; ctx.fillStyle = '#9fe8ff';
      ctx.beginPath(); ctx.arc(e.x, e.y-e.r, e.r*1.1, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1;
    }
    if(e.hp < e.max && grow >= 1){
      const w = Math.max(22, e.r*2.2), h = 4, by = e.y - e.r*3.1 - 6;
      ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(e.x-w/2, by, w, h);
      ctx.fillStyle = e.tk === 'boss' ? '#ffca5c' : '#ff6b8a';
      ctx.fillRect(e.x-w/2, by, w*clamp(e.hp/e.max, 0, 1), h);
    }
  }

  /* 펫 */
  for(const p of pets){
    const fr = curFrame(p);
    drawShadow(p.x, p.y + 26, 9);
    if(fr) drawFrameC(p.sp.anim ? p.def.sp : p.def.sp, fr, p.x, p.y, p.sp.scale, p.flip, 1,
                      p.def.tint ? tinted(p.def.sp, p.def.tint) : null);
  }

  /* 회전검 */
  if(skillEquipped('orbit') && has('orbit') && player.dead <= 0){
    const cnt = Math.min(2 + Math.floor(oLv('orbit')/2), 8), R = 78;
    for(let i=0;i<cnt;i++){
      const a = orbitAng + i*(6.283/cnt);
      const bx = player.x + Math.cos(a)*R, by = player.y - 22 + Math.sin(a)*R*0.75;
      ctx.save(); ctx.translate(bx, by); ctx.rotate(a + 1.57);
      ctx.fillStyle = 'rgba(255,225,160,.92)';
      ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(5,0); ctx.lineTo(0,14); ctx.lineTo(-5,0);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  /* 투사체 */
  for(const b of shots){
    ctx.save(); ctx.translate(b.x, b.y);
    if(b.k === 'slash'){
      ctx.rotate(b.a);
      ctx.strokeStyle = 'rgba(150,220,255,.35)'; ctx.lineWidth = 11; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(0,0,13,-1.0,1.0); ctx.stroke();
      ctx.strokeStyle = b.col; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(0,0,13,-0.85,0.85); ctx.stroke();
    }else if(b.k === 'shuri' || b.k === 'boomer'){
      ctx.rotate(b.spin);
      ctx.fillStyle = b.col;
      ctx.beginPath();
      for(let i=0;i<4;i++){
        const a = i*1.5708;
        ctx.lineTo(Math.cos(a)*13, Math.sin(a)*13);
        ctx.lineTo(Math.cos(a+0.785)*4.5, Math.sin(a+0.785)*4.5);
      }
      ctx.closePath(); ctx.fill();
    }else if(b.k === 'ice'){
      ctx.rotate(b.a);
      ctx.fillStyle = 'rgba(160,235,255,.4)';
      ctx.beginPath(); ctx.ellipse(-8,0,22,8,0,0,6.283); ctx.fill();
      ctx.fillStyle = b.col;
      ctx.beginPath(); ctx.moveTo(18,0); ctx.lineTo(-10,6); ctx.lineTo(-6,0); ctx.lineTo(-10,-6);
      ctx.closePath(); ctx.fill();
    }else if(b.k === 'boom' || b.k === 'meteor'){
      const rr = b.k === 'meteor' ? 15 : 11;
      const g = ctx.createRadialGradient(0,0,2,0,0,rr*1.9);
      g.addColorStop(0,'#fff2c0'); g.addColorStop(0.45,'#ff9a3c'); g.addColorStop(1,'rgba(255,80,20,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,rr*1.9,0,6.283); ctx.fill();
      ctx.fillStyle = '#ffdc8a'; ctx.beginPath(); ctx.arc(0,0,rr*0.6,0,6.283); ctx.fill();
    }else{
      const g = ctx.createRadialGradient(0,0,1,0,0,9);
      g.addColorStop(0,'#ffffff'); g.addColorStop(0.5,b.col); g.addColorStop(1,'rgba(120,255,210,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,9,0,6.283); ctx.fill();
    }
    ctx.restore();
  }

  /* 번개 */
  for(const l of bolts){
    const a = 1 - l.t/0.18;
    ctx.globalAlpha = a;
    ctx.strokeStyle = l.col || '#cfeaff'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(l.x1, l.y1);
    const seg = 4;
    for(let i=1;i<seg;i++){
      const t = i/seg;
      ctx.lineTo(l.x1 + (l.x2-l.x1)*t + rnd(-9,9), l.y1 + (l.y2-l.y1)*t + rnd(-9,9));
    }
    ctx.lineTo(l.x2, l.y2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  /* 폭발 스프라이트 */
  for(const b of booms){
    const fr = curFrame(b);
    if(fr){
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      drawFrameC('boom', fr, b.x, b.y, b.scale, false, b.alpha);
      ctx.restore();
    }
  }

  /* 데미지 숫자 */
  ctx.textAlign = 'center';
  for(const n of nums){
    const a = 1 - n.t/0.85;
    ctx.globalAlpha = a;
    ctx.font = (n.crit ? '900 18px ' : '800 13px ') + 'sans-serif';
    ctx.fillStyle = n.crit ? '#ffd45e' : '#fff';
    ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineWidth = 3.5;
    ctx.strokeText(n.v, n.x+n.ox, n.y); ctx.fillText(n.v, n.x+n.ox, n.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  /* 비네트 */
  const vg = ctx.createRadialGradient(VW/2, VH/2, VH*0.34, VW/2, VH/2, VH*0.9);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.45)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, VH);

  /* 화면 밖 적 표시 */
  for(const e of enemies){
    const px = e.x + ox, py = e.y + oy;
    if(px > -6 && px < VW+6 && py > -6 && py < VH+6) continue;
    const cx = VW/2, cy = VH/2, a = Math.atan2(py-cy, px-cx);
    ctx.save(); ctx.globalAlpha = .5; ctx.fillStyle = e.T.col;
    ctx.translate(cx + Math.cos(a)*(VW/2-13), cy + Math.sin(a)*(VH/2-13)); ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(7,0); ctx.lineTo(-5,4.5); ctx.lineTo(-5,-4.5);
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  ctx.globalAlpha = 1;

  if(msgT > 0){
    const a = clamp(msgT/0.7, 0, 1);
    ctx.globalAlpha = a; ctx.textAlign = 'center';
    ctx.font = '900 28px sans-serif'; ctx.fillStyle = '#fff';
    ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.lineWidth = 6;
    const yy = VH/2 - 40 - (1-a)*14;
    ctx.strokeText(msgTxt, VW/2, yy); ctx.fillText(msgTxt, VW/2, yy);
    ctx.globalAlpha = 1;
  }
}

/* 하단 스킬 슬롯 (쿨다운 표시) */
let slotEls = [], slotIds = [];
function buildSlots(){
  const box = $('slots');
  if(!box || !box.querySelectorAll) return;
  let h = '';
  for(let i=0;i<8;i++){
    const id = S.eqSkill[i], sk = id && SK[id];
    h += '<div class="slot2' + (sk ? '' : ' empty') + '">' + (sk ? sk.ic : '+')
      + (sk ? '<div class="lvv2">' + oLv(id) + '</div>' : '') + '<div class="cdv"></div></div>';
  }
  box.innerHTML = h;
  slotEls = Array.prototype.slice.call(box.querySelectorAll('.cdv'));
  slotIds = S.eqSkill.slice(0, 8);
}
function drawSlots(){
  if(slotIds.join() !== S.eqSkill.slice(0,8).join()) buildSlots();
  for(let i=0;i<slotEls.length;i++){
    const id = slotIds[i], sk = id && SK[id];
    if(!sk){ slotEls[i].style.height = '0%'; continue; }
    if(sk.cd <= 0){ slotEls[i].style.height = '0%'; continue; }
    const full = sk.cd / Math.max(0.35, stat.rate/1.4);
    const left = Math.max(0, skillCd[id] || 0);
    slotEls[i].style.height = clamp(left/full, 0, 1)*100 + '%';
  }
}

const SIDEB = {};
document.querySelectorAll('.side .ibtn').forEach(b => SIDEB[b.dataset.pop] = b);
function sideAlert(k, on){ const b = SIDEB[k]; if(b) b.classList.toggle('on', !!on); }
const TOTAL_ITEMS = SKILLS.length + EQUIPS.length + PETS.length + RELICS.length;

  $('rankN').textContent = rankOf().n;
  $('goldN').textContent = fmt(S.gold);
  $('diaN').textContent = fmt(S.dia);

    + ' <span style="font-size:9.5px;color:#a9bbe6">최고 ' + S.best + '</span>';

    $('prF').style.width = (clamp(promo.t/promo.max, 0, 1)*100) + '%';
    $('prT').textContent = '⚔ 승급전 ' + promo.t.toFixed(1) + '초';
  }else{
    const total = stageTotal();
    $('prF').style.width = (killed/total*100) + '%';

  sideAlert('quest',  QUESTS.some(questReady));
  sideAlert('dun',    DUNGEONS.some(d => S.daily.dun[d.id] > 0));
  sideAlert('promo',  canPromote());

function drawTuto(){
  const box = $('tuto'), t = tutoCur();
  if(!t){ box.classList.add('off'); return; }
  box.classList.remove('off');
  const p = Math.min(t.get(), t.goal), ready = p >= t.goal;
  $('tutoName').textContent = t.n;
  $('tutoBar').style.width = (p/t.goal*100) + '%';
  $('tutoSub').textContent = fmt(p) + ' / ' + fmt(t.goal) + ' · 보상 💎' + fmt(t.c);

  btn.textContent = ready ? '보상 받기' : '진행중';
}

/* ==========================================================================
   강화 · 합성 · 환불
   ========================================================================== */
const MAX_LEVEL = 100, FRAG_BASE = 5, FRAG_CAP = 20, CRAFT_NEED = 5;
const REFUND = [20, 45, 100, 220, 550, 1400];
const fragNeed = l => Math.min(FRAG_BASE + (l-1), FRAG_CAP);
const catOf = it => SK[it.id] ? 'skill' : PT[it.id] ? 'pet' : RL[it.id] ? 'relic' : 'equip';
const isTopGrade = it => it.g >= GRADE.length-1;
const maxLv = it => (catOf(it) === 'equip' && isTopGrade(it)) ? Infinity : MAX_LEVEL;
const atMax = it => has(it.id) && oLv(it.id) >= maxLv(it);
const canLevel = it => has(it.id) && oLv(it.id) < maxLv(it) && frag(it.id) >= fragNeed(oLv(it.id));
function levelUp(it){
  if(!canLevel(it)) return false;
  const o = S.own[it.id];
  o.n -= fragNeed(o.l); o.l++; S.cnt.levelUps++;
  markDirty(); uiDirty = true; save();
  return true;
}
function levelUpMax(it){
  let n = 0;
  while(canLevel(it) && n < 5000){ const o = S.own[it.id]; o.n -= fragNeed(o.l); o.l++; n++; }
  if(n){ S.cnt.levelUps += n; markDirty(); uiDirty = true; save(); }
  return n;
}
function levelUpAll(list){
  let n = 0, lvs = 0;
  list.forEach(it => { const c = levelUpMax(it); if(c){ n++; lvs += c; } });
  return { n, lvs };
}
const nextGradeItem = it => EQUIPS.find(e => e.slot === it.slot && e.g === it.g+1);
const canCraft = it => catOf(it) === 'equip' && !isTopGrade(it) && oLv(it.id) >= MAX_LEVEL
                    && frag(it.id) >= CRAFT_NEED && !!nextGradeItem(it);
function craft(it){
  if(!canCraft(it)) return null;
  const nx = nextGradeItem(it);
  S.own[it.id].n -= CRAFT_NEED;
  if(!has(nx.id)) S.own[nx.id] = { n:0, l:1 }; else S.own[nx.id].n++;
  markDirty(); uiDirty = true;
  if(S.autoEquip) autoEquipAll();
  save();
  return nx;
}
const allMaxed = list => list.every(it => atMax(it));
const refundAmount = list => list.reduce((s, it) => s + frag(it.id)*REFUND[it.g], 0);
function doRefund(bkey){
  const B = BANNERS[bkey];
  if(!allMaxed(B.list)) return;
  const amt = refundAmount(B.list);
  if(amt <= 0){ popup('환불할 재료 없음', '<p>남은 재료가 없습니다.</p>'); return; }
  B.list.forEach(it => { if(S.own[it.id]) S.own[it.id].n = 0; });
  if(B.cur === 'rel') S.relic += amt; else S.dia += amt;
  uiDirty = true; save();
  popup('♻️ 재료 환불', '<p><b>' + B.n + '</b> 도감을 모두 최대 레벨까지 완성했습니다!<br>'
    + '남은 재료를 환불했습니다.<br>' + (B.cur === 'rel' ? '유물석 <b>🔮+' : '다이아 <b>💎+') + fmt(amt) + '</b></p>');
}

/* ==========================================================================
   소환
   ========================================================================== */
const sumLv  = b => S.sum[b].lv;
const sumExp = b => S.sum[b].exp;
function gradeProbs(b){
  const l = sumLv(b);
  const w = GRADE_ROLL.map(g => {
    if(l < g.unlock) return 0;
    const t = clamp((l - g.unlock)/Math.max(1, SUM_MAXLV - g.unlock), 0, 1);
    return g.p0 + (g.p1 - g.p0)*Math.pow(t, 0.9);
  });
  const tot = w.reduce((a,c) => a+c, 0) || 1;
  return w.map(x => x/tot);
}
function sumAddExp(b, n){
  const s = S.sum[b];
  s.exp += n;
  let up = 0;
  while(s.lv < SUM_MAXLV && s.exp >= sumNeedExp(s.lv)){ s.exp -= sumNeedExp(s.lv); s.lv++; up++; }
  if(s.lv >= SUM_MAXLV) s.exp = 0;
  return up;
}
const summonCost = (b, n) => Math.round(BANNERS[b].cost * n * (n >= 10 ? 0.9 : 1));
function payFor(b, cost){
  const B = BANNERS[b];
  if(B.cur === 'rel'){ if(S.relic < cost) return false; S.relic -= cost; }
  else { if(S.dia < cost) return false; S.dia -= cost; }
  return true;
}
function summonOne(b){
  const B = BANNERS[b], p = gradeProbs(b);
  let r = Math.random(), acc = 0, g = 0;
  for(let i=0;i<p.length;i++){ acc += p[i]; if(r < acc){ g = i; break; } }
  let pool = B.list.filter(x => x.g === g);
  while(!pool.length && g > 0){ g--; pool = B.list.filter(x => x.g === g); }
  if(!pool.length) pool = B.list;
  const it = pool[Math.floor(Math.random()*pool.length)];
  const isNew = !has(it.id);
  if(isNew) S.own[it.id] = { n:0, l:1 }; else S.own[it.id].n++;
  return { it, isNew };
}
function doSummon(b, times){
  const B = BANNERS[b];
  if(allMaxed(B.list)){
    popup('🏆 도감 완성', '<p><b>' + B.n + '</b>의 모든 아이템이 최대 레벨입니다.<br>남은 재료를 환불하세요!</p>');
    return;
  }
  const cost = summonCost(b, times);
  if(!payFor(b, cost)){
    popup(B.cur === 'rel' ? '🔮 유물석 부족' : '💎 다이아 부족',
      '<p>' + (B.cur === 'rel' ? '유물석' : '다이아') + '이(가) <b>'
      + fmt(Math.ceil(cost - (B.cur === 'rel' ? S.relic : S.dia))) + '</b> 더 필요합니다.<br>'
      + (B.cur === 'rel' ? '던전 <b>고대 유적</b>에서 유물석을 얻으세요!' : '출석 · 룰렛 · 퀘스트 · 상점에서 다이아를 얻으세요!') + '</p>');
    return;
  }
  S.summons += times;
  const ck = b === 'skill' ? 'sumSkill' : b === 'pet' ? 'sumPet' : b === 'relic' ? 'sumRelic' : 'sumEquip';
  S.cnt[ck] += times;
  const lvUp = sumAddExp(b, times);
  const res = [];
  for(let i=0;i<times;i++) res.push(summonOne(b));
  markDirty(); uiDirty = true;
  if(S.autoEquip) autoEquipAll();
  save();
  showSummonResult(b, times, res, lvUp);
}
const itemIcon = it => it.ic || (it.sp ? (it.sp === 'dragon' ? '🐉' : it.sp === 'bird' ? '🐦' : '🤖') : '❔');

function showSummonResult(b, times, res, lvUp){
  const B = BANNERS[b];
  const best = res.reduce((a,c) => a.it.g >= c.it.g ? a : c);
  const BG = GRADE[best.it.g], newCnt = res.filter(r => r.isNew).length;
  let h = '<div class="sumhead" style="background:linear-gradient(90deg,' + BG.bg + ',#141a30);border:1.5px solid '
    + BG.c + ';color:' + BG.c + '">' + BG.ic + ' ' + B.n + ' ' + times + '회 소환 — 최고 <b>' + BG.n + '</b></div>'
    + '<div class="cards">';
  res.forEach((r, i) => {
    const G = GRADE[r.it.g];
    h += '<div class="rc' + (r.it.g >= 3 ? ' hi' : '') + '" style="border-color:' + G.c + ';background:' + G.bg
      + ';animation-delay:' + (i*0.04).toFixed(2) + 's">'
      + (r.isNew ? '<div class="new">NEW</div>' : '')
      + '<div style="font-size:17px;line-height:21px">' + itemIcon(r.it) + '</div>'
      + '<div class="rg" style="color:' + G.c + '">' + G.n + '</div>'
      + '<div class="rn">' + r.it.n + '</div>'
      + '<div class="rg" style="color:#93a2c6">' + (r.isNew ? '획득!' : '+1') + '</div></div>';
  });
  h += '</div><p>신규 <b style="color:#8ff0a8">' + newCnt + '종</b> · 중복 <b>' + (times-newCnt) + '</b>(재료 전환)'
    + (lvUp ? '<br><b style="color:#8fd6ff">소환 레벨 +' + lvUp + '! (Lv.' + sumLv(b) + ')</b>' : '')
    + '<br>보유 ' + (B.cur === 'rel' ? '🔮 <b>' + fmt(S.relic) : '💎 <b>' + fmt(S.dia)) + '</b></p>'
    + '<div class="mrow"><button class="gbtn blue" id="sumAgain">다시 소환</button>'
    + '<button class="gbtn green" id="sumClose">확인</button></div>';
  $('mbox').innerHTML = h;
  $('modal').classList.add('on');
  $('sumClose').onclick = closeModal;
  $('sumAgain').onclick = () => doSummon(b, times);
}

function toggleEquip(it, cat){
  if(cat === 'skill'){
    const i = S.eqSkill.indexOf(it.id);
    if(i >= 0) S.eqSkill.splice(i,1);
    else{
      if(S.eqSkill.length >= 8){ popup('슬롯 부족', '<p>스킬은 최대 <b>8개</b>까지 장착할 수 있습니다.</p>'); return; }
      S.eqSkill.push(it.id); skillCd[it.id] = 0;
    }
  }else if(cat === 'pet'){
    const i = S.eqPet.indexOf(it.id);
    if(i >= 0) S.eqPet.splice(i,1);
    else{
      if(S.eqPet.length >= 3){ popup('슬롯 부족', '<p>펫은 최대 <b>3마리</b>까지 장착할 수 있습니다.</p>'); return; }
      S.eqPet.push(it.id);
    }
    syncPets();
  }else if(cat === 'relic'){
    const i = S.eqRelic.indexOf(it.id);
    if(i >= 0) S.eqRelic.splice(i,1);
    else{
      if(S.eqRelic.length >= 3){ popup('슬롯 부족', '<p>유물은 최대 <b>3개</b>까지 장착할 수 있습니다.</p>'); return; }
      S.eqRelic.push(it.id);
    }
  }else S.eqSlot[it.slot] = (S.eqSlot[it.slot] === it.id) ? null : it.id;
  markDirty(); uiDirty = true; save();
}
function power(it, cat){
  if(cat === 'skill') return skillDmg(it) * (it.cd > 0 ? 1/it.cd : 3);
  if(cat === 'pet')   return petDmg(it) / it.cd;
  return gMul(it.g) * lvMul(oLv(it.id));
}
function autoEquipAll(){
  S.eqSkill = SKILLS.filter(s => has(s.id)).sort((a,b) => power(b,'skill') - power(a,'skill')).slice(0,8).map(s => s.id);
  S.eqPet   = PETS.filter(p => has(p.id)).sort((a,b) => power(b,'pet') - power(a,'pet')).slice(0,3).map(p => p.id);
  S.eqRelic = RELICS.filter(r => has(r.id)).sort((a,b) => power(b,'relic') - power(a,'relic')).slice(0,3).map(r => r.id);
  SLOTS.forEach(s => {
    const best = EQUIPS.filter(e => e.slot === s.k && has(e.id)).sort((a,b) => power(b,'equip') - power(a,'equip'))[0];
    S.eqSlot[s.k] = best ? best.id : null;
  });
  syncPets(); markDirty(); uiDirty = true;
}
let autoEqT = 0;
function autoEquipTick(dt){
  autoEqT -= dt;
  if(autoEqT > 0) return;
  autoEqT = 2; autoEquipAll();
}

   컬렉션 · 퀘스트 · 튜토리얼 · 우편

function collReady(cat){ const t = COLL[cat].tiers[S.coll[cat]]; return !!t && ownedIn(COLL[cat].list) >= t.need; }
function claimColl(cat){
  if(!collReady(cat)) return;
  const t = COLL[cat].tiers[S.coll[cat]];
  S.coll[cat]++;
  markDirty(); uiDirty = true; save();
  popup('🏆 컬렉션 보너스 획득!', '<p><b>' + COLL[cat].n + ' 도감</b> ' + t.need + '종 달성<br>'
    + '<span style="color:#8ff0a8;font-size:14px">' + t.n + '</span><br>영구 적용됩니다!</p>');
}
const questGoal  = q => Math.ceil(q.base * Math.pow(q.mul, S.quest[q.id].s));
const questProg  = q => Math.max(0, q.get() - (S.quest[q.id].base || 0));
const questReady = q => questProg(q) >= questGoal(q);
function claimQuest(q){
  if(!questReady(q)) return;
  const st = S.quest[q.id], rw = q.rw(st.s);
  S.gold += rw.g; S.dia += rw.c;
  st.base = q.get(); st.s++;
  uiDirty = true; save();
  popup('📜 퀘스트 완료!', '<p><b>' + q.n + '</b> 달성!<br>골드 <b>+' + fmt(rw.g) + '</b><br>다이아 <b>💎+' + fmt(rw.c) + '</b></p>');
}
function claimAllQuests(){
  let n = 0, g = 0, c = 0, guard = 0;
  while(guard++ < 300){
    const q = QUESTS.find(questReady);
    if(!q) break;
    const st = S.quest[q.id], rw = q.rw(st.s);
    S.gold += rw.g; S.dia += rw.c; g += rw.g; c += rw.c;
    st.base = q.get(); st.s++; n++;
  }
  if(!n) return;
  uiDirty = true; save();
  popup('📜 퀘스트 일괄 수령', '<p>퀘스트 <b>' + n + '</b>건 완료!<br>골드 <b>+' + fmt(g) + '</b><br>다이아 <b>💎+' + fmt(c) + '</b></p>');
}
const tutoCur   = () => S.tuto < TUTO.length ? TUTO[S.tuto] : null;
const tutoReady = () => { const t = tutoCur(); return !!t && t.get() >= t.goal; };
function claimTuto(){
  const t = tutoCur();
  if(!t || !tutoReady()) return;
  S.dia += t.c; S.tuto++;
  uiDirty = true; save();
  popup('📌 튜토리얼 완료!', '<p><b>' + t.n + '</b><br>다이아 <b>💎+' + fmt(t.c) + '</b> 획득!</p>'
    + (tutoCur() ? '<p style="color:#8fd6ff;margin-top:5px">다음 — ' + tutoCur().n + '</p>'
                 : '<p style="color:#8ff0a8;margin-top:5px">모든 튜토리얼 완료! 🎉</p>'));
}
const mailLeft = () => MAILS.filter(m => !S.mail[m.id]).length;
function claimAllMail(){
  let g = 0, c = 0, r = 0, n = 0;
  MAILS.forEach(m => { if(S.mail[m.id]) return; S.mail[m.id] = 1; g += m.g; c += m.c; r += m.r || 0; n++; });
  if(!n) return;
  S.gold += g; S.dia += c; S.relic += r;
  uiDirty = true; save();
  popup('📬 우편 수령', '<p>우편 <b>' + n + '</b>통 수령!<br>골드 <b>+' + fmt(g) + '</b><br>다이아 <b>💎+' + fmt(c)
    + '</b><br>유물석 <b>🔮+' + fmt(r) + '</b></p>');
}

function giveReward(r){
  const out = [];
  if(r.dia){     S.dia += r.dia;     out.push('💎 ' + fmt(r.dia)); }
  if(r.rel){     S.relic += r.rel;   out.push('🔮 ' + fmt(r.rel)); }
  if(r.gold){    S.gold += r.gold;   out.push('💰 ' + fmt(r.gold)); }
  if(r.goldMul){ const g = eGold(S.best)*50*r.goldMul*stat.goldMul; S.gold += g; out.push('💰 ' + fmt(g)); }
  if(r.frag){
    const pool = SKILLS.concat(EQUIPS, PETS).filter(x => has(x.id));
    for(let i=0;i<r.frag;i++){
      const it = pool.length ? pool[Math.floor(Math.random()*pool.length)] : null;
      if(it) S.own[it.id].n++;
    }
    out.push('🧩 재료 ' + r.frag);
    markDirty();
  }
  return out.join(' · ');
}
function claimAttend(){
  if(S.att.date === today()) return;
  const day = S.att.n % 28, r = ATTEND[day];
  S.att.n++; S.att.date = today();
  const txt = giveReward(r);
  uiDirty = true; save();
  popup('📅 ' + (day+1) + '일차 출석 보상', '<p>' + r.ic + ' <b>' + txt + '</b><br>내일 또 접속해 주세요!</p>');
}
function spinRoulette(){
  if(S.daily.spins <= 0){
    popup('🎰 룰렛 종료', '<p>오늘 무료 룰렛을 모두 사용했습니다.<br>내일 <b>' + ROUL_FREE + '회</b> 충전됩니다.</p>');
    return;
  }
  S.daily.spins--; S.cnt.spins++;
  const tot = ROULETTE.reduce((s,x) => s+x.w, 0);
  let r = Math.random()*tot, idx = 0;
  for(let i=0;i<ROULETTE.length;i++){ r -= ROULETTE[i].w; if(r <= 0){ idx = i; break; } }
  const txt = giveReward(ROULETTE[idx]);
  uiDirty = true; save();
  openRoulette(idx, txt);
}
function challengeDungeon(d){
  if(S.daily.dun[d.id] <= 0){
    popup('입장 횟수 소진', '<p>오늘 <b>' + d.n + '</b> 입장 횟수를 모두 사용했습니다.<br>내일 <b>' + DUN_TRY + '회</b> 충전됩니다.</p>');
    return;
  }
  S.daily.dun[d.id]--; S.cnt.dungeon++;
  const f = S.dun[d.id], need = d.req(f), my = cp();
  if(my >= need){
    S.dun[d.id]++;
    const txt = giveReward(d.rw(f));
    uiDirty = true; save();
    popup('🏆 ' + d.n + ' ' + f + '층 클리어!', '<p>전투력 <b>' + fmt(my) + '</b> ≥ 요구 <b>' + fmt(need) + '</b><br>'
      + '보상 — <b>' + txt + '</b><br><span style="color:#8fd6ff">다음 ' + (f+1) + '층 해금!</span></p>');
  }else{
    uiDirty = true; save();
    popup('💀 ' + d.n + ' ' + f + '층 실패', '<p>전투력이 부족합니다.<br>내 전투력 <b>' + fmt(my)
      + '</b> / 요구 <b style="color:#ff6b7f">' + fmt(need) + '</b><br>더 성장한 뒤 다시 도전하세요!</p>');
  }
}
function sweepDungeon(d){
  const f = S.dun[d.id] - 1;

}
function buyPack(p){

function buyAvatar(a){

  S.dia -= a.cost; S.avatars[a.id] = 1; S.avatar = a.id;

}

const QTYS = [1, 10, 'MAX'];
function costOf(u, from, n){ let c = 0; for(let i=0;i<n;i++) c += u.cost(from+i); return c; }
function maxBuy(u){
  let n = 0, c = 0; const l = lv(u.id);
  while(n < 500){ const nc = c + u.cost(l+n); if(nc > S.gold) break; c = nc; n++; }
  return { n, c };
}
function buyInfo(u){
  if(S.buyQty === 'MAX'){ const m = maxBuy(u); return { n:Math.max(1,m.n), cost:m.n ? m.c : u.cost(lv(u.id)), ok:m.n > 0 }; }
  const c = costOf(u, lv(u.id), S.buyQty);
  return { n:S.buyQty, cost:c, ok:S.gold >= c };
}
function applyBuy(u, n, cost){
  S.gold -= cost;
  const before = u.id === 'hp' ? U.hp.val(lv('hp'))*mulHp() : 0;
  S.lv[u.id] = lv(u.id) + n; S.upgrades += n;
  if(u.id === 'hp') player.hp += U.hp.val(lv('hp'))*mulHp() - before;
}
let autoT = 0;
function autoBuyTick(dt){
  autoT -= dt;
  if(autoT > 0) return;
  autoT = 0.4;
  let best = null, bc = Infinity;
  for(const u of UPG){ const c = u.cost(lv(u.id)); if(c <= S.gold && c < bc){ bc = c; best = u; } }
  if(best) applyBuy(best, 1, bc);
}

function petIconHtml(it){ return '<canvas width="46" height="32" data-pet="' + it.id + '"></canvas>'; }
function paintPetIcons(root){
  root.querySelectorAll('canvas[data-pet]').forEach(cv => {
    const p = PT[cv.dataset.pet];
    if(!p) return;
    const A = ATLAS[p.sp];
    if(!A || !A.image) return;
    const list = A.a[PET_SP[p.sp].anim];
    if(!list || !list.length) return;
    const fr = A.f[list[0]], g = cv.getContext('2d');
    const src = p.tint ? tinted(p.sp, p.tint) : A.image;
    if(!src) return;
    g.clearRect(0,0,cv.width,cv.height);
    const sc = Math.min(cv.width/fr[6], cv.height/fr[7])*0.95;
    g.drawImage(src, fr[0], fr[1], fr[2], fr[3],
      (cv.width - fr[6]*sc)/2 + fr[4]*sc, (cv.height - fr[7]*sc)/2 + fr[5]*sc, fr[2]*sc, fr[3]*sc);
  });
}

                   rw.rel ? '🔮' + fmt(rw.rel) : '', rw.frag ? '🧩' + rw.frag : ''].filter(Boolean).join(' · ');
    h += '<div class="li"><div class="lt">' + d.ic + ' ' + d.n + ' <span style="color:#8fd6ff;font-size:10.5px">'
      +  f + '층</span> <span style="float:right;font-size:10.5px;color:' + (left ? '#8ff0a8' : '#ff6b7f') + '">입장 '
      +  left + '/' + DUN_TRY + '</span></div>'
      +  '<div class="ls">' + d.d + '<br>보상 ' + rwTxt + ' · 요구 전투력 <b style="color:'
      +  (ok ? '#8ff0a8' : '#ff6b7f') + '">' + fmt(need) + '</b></div>'
      +  '<div class="lf"><button class="mini gold" data-sweep="' + d.id + '"' + (left > 0 && f > 1 ? '' : ' disabled') + '>⚡ 소탕</button>'
      +  '<button class="mini" data-dun="' + d.id + '"' + (left > 0 ? '' : ' disabled') + '>도전</button></div></div>';
  });
  setBody('bDun', h);
}

$('bShop').addEventListener('click', e => {
  const p = e.target.closest('[data-pack]');
  if(p){ buyPack(PACKS.find(x => x.id === p.dataset.pack)); return; }
  const x = e.target.closest('[data-ex]');

    const ex = EXCHANGE.find(v => v.dia === +x.dataset.ex);

    S.dia -= ex.dia; S.relic += ex.rel; uiDirty = true; save();
    popup('🔮 교환 완료', '<p>다이아 <b>💎' + fmt(ex.dia) + '</b> → 유물석 <b>🔮' + fmt(ex.rel) + '</b></p>');
    return;
  }
  const a = e.target.closest('[data-av]');
  if(a) buyAvatar(AV[a.dataset.av]);
});

/* ---- 팝업: 출석 / 룰렛 / 우편 / 퀘스트 / 승급 ---- */
function openAttend(){
  const day = S.att.n % 28, can = S.att.date !== today();
  let h = '<h2>📅 출석 보상</h2><p>연속 <b>' + S.att.n + '</b>일 출석 중</p><div class="cal" style="margin-top:9px">';
  ATTEND.forEach((r, i) => {
    const got = i < day || (i === day && !can);
    const val = r.dia ? '💎' + fmt(r.dia) : r.rel ? '🔮' + fmt(r.rel) : '💰';
    h += '<div class="day' + (got ? ' got' : '') + (i === day && can ? ' today' : '') + '">'
      +  '<div class="dn">' + (i+1) + '일</div><div class="di">' + r.ic + '</div><div class="dv">' + val + '</div></div>';
  });
  h += '</div><button class="gbtn" id="attBtn"' + (can ? '' : ' disabled') + '>'
    + (can ? (day+1) + '일차 보상 받기' : '내일 다시 받을 수 있습니다') + '</button>'
    + '<button class="gbtn green" id="attClose">닫기</button>';
  $('mbox').innerHTML = h;
  $('modal').classList.add('on');
  $('attClose').onclick = closeModal;
  $('attBtn').onclick = claimAttend;
}

    const v = r.dia ? '💎' + fmt(r.dia) : r.rel ? '🔮' + fmt(r.rel) : '💰 골드';

/* ---- 장비 탭 (무기/방패/목걸이 서브탭) ---- */
function renderEq(){
  let top = '<div class="subtabs">';
  EQ_BANNERS.forEach(k => top += '<div class="stab' + (S.eqTab === k ? ' on' : '') + '" data-stab="' + k + '">'
    + BANNERS[k].ic + ' ' + BANNERS[k].n + '</div>');

bindBanner('bSk',  () => 'skill');
bindBanner('bEq',  () => S.eqTab);
bindBanner('bPet', () => 'pet');
bindBanner('bRel', () => 'relic');

/* ---- 탭 전환 ---- */
const TABBODY = { up:'bUp', sk:'bSk', eq:'bEq', pet:'bPet', rel:'bRel', shop:'bShop', dun:'bDun', st:'bSt' };
function goTab(k){
  curTab = k;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.dataset.t === k));
  Object.keys(TABBODY).forEach(z => $(TABBODY[z]).classList.toggle('on', z === k));
  uiDirty = true; renderUI();
}
document.querySelectorAll('.tab').forEach(t => { t.onclick = () => goTab(t.dataset.t); });
document.querySelectorAll('.side .ibtn').forEach(b => {
  b.onclick = () => {
    const k = b.dataset.pop;
    if(k === 'attend') openAttend();
    else if(k === 'roul') openRoulette(-1, '');
    else if(k === 'mail') openMail();
    else if(k === 'quest') openQuest();
    else if(k === 'dun') openDungeon();
    else if(k === 'promo') openPromo();
  };
});
$('profBtn').onclick = openProfile;
document.querySelectorAll('[data-go]').forEach(b => b.onclick = e => {
  e.stopPropagation();
  goTab(b.dataset.go);
});
$('tutoBtn').onclick = claimTuto;

function renderUI(){
  if(curTab === 'up') renderUp();
  else if(curTab === 'sk')  renderBanner('skill', 'bSk');
  else if(curTab === 'eq')  renderEq();
  else if(curTab === 'pet') renderBanner('pet', 'bPet');
  else if(curTab === 'rel') renderBanner('relic', 'bRel');
  else if(curTab === 'dun') renderDun();
  else if(curTab === 'shop') renderShop();
  else if(curTab === 'st')  renderSt();
  document.querySelectorAll('.tab').forEach(t => {
    const k = t.dataset.t;
    const al = k === 'sk' ? collReady('skill') : k === 'eq' ? collReady('equip')
             : k === 'pet' ? collReady('pet') : k === 'rel' ? collReady('relic')
             : k === 'shop' ? AVATARS.some(a => !S.avatars[a.id] && S.dia >= a.cost)
             : k === 'up' ? S.sp > 0 : false;
    t.classList.toggle('alert', !!al);
  });
  uiDirty = false;
}

/* ---- 오프라인 보상 ---- */
function offlineReward(lastTime){
  if(!lastTime) return;
  const sec = Math.min((Date.now()-lastTime)/1000, 8*3600);
  if(sec < 60) return;
  const gold = eGold(S.stage) * stat.goldMul * 1.2 * sec * 0.5;
  const dia = Math.floor(sec/20);          /* 분당 3 다이아 */
  S.gold += gold; S.dia += dia;
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60);
  popup('🌙 방치 보상', '<p>자리를 비운 <b>' + h + '시간 ' + m + '분</b> 동안<br>'
    + '골드 <b>💰' + fmt(gold) + '</b><br>다이아 <b>💎' + fmt(dia) + '</b><br>를 획득했습니다!</p>');
}

/* ==========================================================================
   메인 루프
   ========================================================================== */
let last = 0, saveT = 0, uiT = 0, dayT = 0;
function loop(now){
  requestAnimationFrame(loop);
  if(!last) last = now;
  let dt = (now-last)/1000; last = now;
  if(dt > 0.1) dt = 0.1;
  S.playtime += dt;

  step(dt);
  draw();
  drawHud();
  drawTuto();

  uiT += dt;
  if(uiT > 0.35){ uiT = 0; renderUI(); }
  dayT += dt;
  if(dayT > 30){ dayT = 0; dailyCheck(); }
  saveT += dt;
  if(saveT > 5){ saveT = 0; save(); }
}

/* ---------------- 시작 ---------------- */
loadAtlases(() => {
  $('loading').classList.add('off');
  const lastTime = load();
  dailyCheck();
  markDirty();
  const owed = Math.max(0, (S.plv - 1)*SP_PER_LV - (S.sp + S.spAtk + S.spHp));
  if(owed > 0){ S.sp += owed; if(S.spAuto) autoSpend(); }
  if(!has('slash')){ S.own.slash = { n:0, l:1 }; S.eqSkill = ['slash']; }
  if(S.autoEquip) autoEquipAll();
  player.hp = stat.maxHp;
  setAnim(player, 'knight', 'idle', 8, true);
  syncPets();
  spawnStage();
  renderUI();
  offlineReward(lastTime);
  addEventListener('visibilitychange', () => { if(document.hidden) save(); });
  addEventListener('beforeunload', save);
  requestAnimationFrame(loop);
});
</script>

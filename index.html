let uiDirty = true, curTab = 'hero', heroTab = 'eq', panelOpen = true;
function setBody(id, html){ const el = $(id); const st = el.scrollTop; el.innerHTML = html; el.scrollTop = st; return el; }
function closeModal(){ $('modal').classList.remove('on'); }
/* 모달 껍데기는 헤더(갈색 바) + 본문(베이지)로 고정이다.
   호출부는 예전처럼 앞머리에 <h2>제목</h2> 을 붙여 넘기고, 여기서 헤더로 옮겨 담는다. */
function showModal(html){
  const m = /^\s*<h2[^>]*>([\s\S]*?)<\/h2>\s*/.exec(html);
  /* 레퍼런스 헤더에는 이모지가 없다. 앞에 붙은 이모지를 떼야 제목이 진짜 가운데로 온다 */
  $('mtitle').textContent = (m ? m[1] : '').replace(/^[^가-힣\w]+/, '').trim();
  const body = $('mbox');
  body.innerHTML = '<div class="mwell">' + (m ? html.slice(m[0].length) : html) + '</div>';
  /* 레퍼런스는 하단 버튼이 패널 바깥(베이지 위)에 놓인다 — 끝에 붙은 버튼 묶음을 패널 밖으로 뺀다 */
  const well = body.firstElementChild, tail = [];
  while(well.lastElementChild &&
        (well.lastElementChild.tagName === 'BUTTON' || well.lastElementChild.classList.contains('mrow')))
    tail.unshift(well.removeChild(well.lastElementChild));
  tail.forEach(n => body.appendChild(n));
  if(!well.childElementCount && !well.textContent.trim()) well.remove();
  body.scrollTop = 0;
  $('modal').classList.add('on');
}
function popup(title, html){
  showModal('<h2>' + title + '</h2>' + html + '<button class="gbtn green" id="okBtn">확인</button>');
  $('okBtn').onclick = closeModal;
}

const QTYS = [1, 10, 'MAX'];
function costOf(u, from, n){ let c = 0; for(let i=0;i<n;i++) c += u.cost(from+i); return c; }
function maxBuy(u){
  let n = 0, c = 0; const l = lv(u.id);
  while(n < 500){ const nc = c + u.cost(l+n); if(nc > S.gold) break; c = nc; n++; }
  return { n, c };
}
function buyInfo(u){
  if(S.buyQty === 'MAX'){ const m = maxBuy(u); return { n:Math.max(1,m.n), cost:m.n ? m.c : u.cost(lv(u.id)), ok:m.n > 0 }; }
  const c = costOf(u, lv(u.id), S.buyQty);
  return { n:S.buyQty, cost:c, ok:S.gold >= c };
}
function applyBuy(u, n, cost){
  S.gold -= cost;
  const before = u.id === 'hp' ? U.hp.val(lv('hp'))*mulHp() : 0;
  S.lv[u.id] = lv(u.id) + n; S.upgrades += n;
  if(u.id === 'hp') player.hp += U.hp.val(lv('hp'))*mulHp() - before;
}
let autoT = 0;
function autoBuyTick(dt){
  autoT -= dt;
  if(autoT > 0) return;
  autoT = 0.4;
  let best = null, bc = Infinity;
  for(const u of UPG){ const c = u.cost(lv(u.id)); if(c <= S.gold && c < bc){ bc = c; best = u; } }
  if(best) applyBuy(best, 1, bc);
}

function petIconHtml(it){ return '<canvas width="92" height="64" data-pet="' + it.id + '"></canvas>'; }
function paintPetIcons(root){
  root.querySelectorAll('canvas[data-pet]').forEach(cv => {
    const p = PT[cv.dataset.pet];
    if(!p) return;
    const A = ATLAS[p.sp];
    if(!A || !A.image) return;
    const list = A.a[PET_SP[p.sp].anim];
    if(!list || !list.length) return;
    const fr = A.f[list[0]], g = cv.getContext('2d');
    const src = p.tint ? tinted(p.sp, p.tint) : A.image;
    if(!src) return;
    g.clearRect(0,0,cv.width,cv.height);
    const sc = Math.min(cv.width/fr[6], cv.height/fr[7])*0.95;
    g.drawImage(src, fr[0], fr[1], fr[2], fr[3],
      (cv.width - fr[6]*sc)/2 + fr[4]*sc, (cv.height - fr[7]*sc)/2 + fr[5]*sc, fr[2]*sc, fr[3]*sc);
  });
}

const itemById = id => SK[id] || EQ[id] || PT[id] || RL[id];

function showItem(id){
  const it = itemById(id);
  if(!it) return;
  const cat = catOf(it), G = GRADE[it.g], own = has(id), need = fragNeed(oLv(id));
  const eq = cat === 'skill' ? skillEquipped(id) : cat === 'pet' ? petEquipped(id)
           : cat === 'relic' ? relicEquipped(id) : eqEquipped(it);
  let eff = '', ownTxt = '', eqTxt = '';
  if(cat === 'skill'){
    eff = it.d + '<br>피해 <b>' + fmt(skillDmg(it)) + '</b>' + (it.cd > 0 ? ' · 쿨타임 <b>' + it.cd.toFixed(2) + '초</b>' : ' · <b>지속형</b>');
    ownTxt = '공격력 +' + pct(ownVal(it)); eqTxt = '전투에서 자동 발동';
  }else if(cat === 'pet'){
    eff = '플레이어를 따라다니며 자동 공격<br>피해 <b>' + fmt(petDmg(it)) + '</b> · 주기 <b>' + it.cd.toFixed(2) + '초</b>';
    ownTxt = '공격력 +' + pct(ownVal(it)*0.6) + ' · 골드 +' + pct(ownVal(it)); eqTxt = '전투에 참여해 공격';
  }else if(cat === 'relic'){
    eff = RELIC_EFF[it.eff] + ' 상승 유물';
    ownTxt = RELIC_EFF[it.eff] + ' +' + pct(relicVal(it));
    eqTxt = RELIC_EFF[it.eff] + ' +' + pct(relicVal(it)*2) + ' (보유 효과 포함)';
  }else{
    const s = SLOTS.find(x => x.k === it.slot);
    eff = '부위 <b>' + s.n + '</b> · 효과 <b>' + s.stat + '</b>';
    ownTxt = s.stat + ' +' + pct(ownVal(it)); eqTxt = s.stat + ' +' + pct(equipVal(it));
  }
  let h = '<h2 style="color:' + G.c + '">' + itemIcon(it) + ' ' + (own ? it.n : '???') + '</h2>'
    + '<p><b style="color:' + G.c + '">' + G.ic + ' ' + G.n + '</b>' + (own ? ' · Lv.' + oLv(id) : '') + '</p>'
    + '<p>' + (own ? eff : '아직 획득하지 못했습니다. 소환으로 획득하세요.') + '</p>'
    + '<div style="text-align:left;background:#0e1428;border-radius:20px;padding:16px 20px;margin-top:18px">'
    + '<p style="color:#8fd6ff">보유 효과 — <b style="color:#8ff0a8">' + ownTxt + '</b></p>'
    + '<p style="color:#ffb648">장착 효과 — <b style="color:#8ff0a8">' + eqTxt + '</b></p></div>';
  if(own){
    const maxed = atMax(it), lim = maxLv(it);
    h += '<p style="margin-top:16px">레벨 <b>' + oLv(id) + ' / ' + (lim === Infinity ? '∞' : lim) + '</b>'
      +  (maxed ? ' <span style="color:#ffd45e">MAX</span>' : '') + '<br>보유 재료 <b>' + fmt(frag(id)) + '</b>'
      +  (maxed ? '' : ' / 필요 <b>' + need + '</b>') + '</p>'
      +  '<div class="mrow"><button class="gbtn green" id="mEq">' + (eq ? '장착 해제' : '장착하기') + '</button>'
      +  (maxed
          ? (cat === 'equip'
              ? '<button class="gbtn purple" id="mCraft"' + (canCraft(it) ? '' : ' disabled') + '>합성 ('
                + CRAFT_NEED + '개 → ' + GRADE[Math.min(it.g+1, GRADE.length-1)].n + ')</button>'
              : '<button class="gbtn" disabled>최대 레벨</button>')
          : '<button class="gbtn blue" id="mLv"' + (canLevel(it) ? '' : ' disabled') + '>강화 (Lv.' + (oLv(id)+1) + ')</button>')
      +  '</div>'
      +  (maxed ? '' : '<button class="gbtn blue" id="mLvAll"' + (canLevel(it) ? '' : ' disabled') + '>가능한 만큼 강화</button>');
    if(cat === 'equip' && !isTopGrade(it) && !maxed)
      h += '<p style="margin-top:14px;font-size:21px;color:#7d8bad">Lv.' + MAX_LEVEL + ' 달성 후 같은 장비 '
        + CRAFT_NEED + '개로 <b>' + GRADE[it.g+1].n + '</b> 합성 가능</p>';
    if(cat === 'equip' && isTopGrade(it))
      h += '<p style="margin-top:14px;font-size:21px;color:#ffb648">최고 등급 장비는 <b>무한 강화</b>됩니다.</p>';
  }
  h += '<button class="gbtn" id="mClose">닫기</button>';
  showModal(h);
  $('mClose').onclick = closeModal;
  if(own){
    $('mEq').onclick = () => { toggleEquip(it, cat); showItem(id); };
    const a = $('mLv'), b = $('mLvAll'), c = $('mCraft');
    if(a) a.onclick = () => { if(levelUp(it)) showItem(id); };
    if(b) b.onclick = () => { levelUpMax(it); showItem(id); };
    if(c) c.onclick = () => {
      const nx = craft(it);
      if(nx) popup('⚗️ 합성 성공!', '<p><b style="color:' + GRADE[it.g].c + '">' + it.n + '</b> ' + CRAFT_NEED + '개 소모<br>'
        + '<b style="color:' + GRADE[nx.g].c + ';font-size:30px">' + GRADE[nx.g].n + ' ' + nx.n + '</b> 획득!</p>');
    };
  }
}

  });
  $('mbox').querySelectorAll('[data-sweep]').forEach(b => b.onclick = () => {
    sweepDungeon(DUNGEONS.find(d => d.id === b.dataset.sweep));
  });
}
function openProfile(){
  renderSt();
  showModal('<h2>📊 내 정보</h2>' + $('bSt').innerHTML
    + '<button class="gbtn green" id="stClose">닫기</button>');
  $('stClose').onclick = closeModal;
  const pb = $('promoBtn'); if(pb) pb.onclick = openPromo;
  const rb = $('resetBtn');
  if(rb) rb.onclick = () => { if(confirm('모든 진행 상황이 삭제됩니다. 계속할까요?')){ localStorage.removeItem(KEY); location.reload(); } };
}
function openPromo(){
  const r = nextRank();
  if(!r){ popup('🏅 최고 계급', '<p>이미 최고 계급입니다! 🎉</p>'); return; }
  const okS = S.best >= r.stage, okC = cp() >= r.cp;
  showModal('<h2>🏅 승급전</h2>'
    + '<p>현재 <b>' + rankOf().ic + ' ' + rankOf().n + '</b> → 도전 <b style="color:#ffd45e">' + r.ic + ' ' + r.n + '</b></p>'
    + '<div style="text-align:left;background:#0e1428;border-radius:20px;padding:18px 22px;margin-top:18px">'
    + '<p>최고 스테이지 <b style="color:' + (okS ? '#8ff0a8' : '#ff6b7f') + '">' + S.best + ' / ' + r.stage + '</b></p>'
    + '<p>전투력 <b style="color:' + (okC ? '#8ff0a8' : '#ff6b7f') + '">' + fmt(cp()) + ' / ' + fmt(r.cp) + '</b></p></div>'
    + '<p style="margin-top:16px">조건을 만족하면 <b>승급 수호자</b>가 등장합니다.<br><b>60초</b> 안에 처치하면 승급!<br>'
    + '승급 시 공격력 · 체력 <b>+25%</b> (누적)</p>'
    + '<button class="gbtn" id="pgo"' + (canPromote() ? '' : ' disabled') + '>승급전 시작</button>'
    + '<button class="gbtn green" id="pclose">닫기</button>');
  $('pclose').onclick = closeModal;
  $('pgo').onclick = startPromo;
}

/* ---- 장비 탭 (무기/방패/목걸이 서브탭) ---- */
function renderEq(){
  let top = '<div class="subtabs">';
  EQ_BANNERS.forEach(k => top += '<div class="stab' + (S.eqTab === k ? ' on' : '') + '" data-stab="' + k + '">'
    + BANNERS[k].ic + ' ' + BANNERS[k].n + '</div>');
  top += '</div>';
  renderBanner(S.eqTab, 'bEq', top);
}
bindBanner('bSk',  () => 'skill');
bindBanner('bEq',  () => S.eqTab);
bindBanner('bPet', () => 'pet');
bindBanner('bRel', () => 'relic');

/* ---- 탭 전환 ----
   탭 5개(hero/grow/adv/box/shop) → 패널 본문 매핑. hero 는 서브탭(장비·스킬·동료)으로 다시 갈린다.
   같은 탭을 다시 누르면 패널이 닫히고, 열려 있는 동안 그 탭 자리는 ✕ 로 바뀐다. */
const TABBODY = { up:'bUp', sk:'bSk', eq:'bEq', pet:'bPet', rel:'bRel', shop:'bShop', dun:'bDun', st:'bSt' };
const HEROBODY = { eq:'bEq', sk:'bSk', pet:'bPet' };
function bodyOf(k){ return k === 'hero' ? HEROBODY[heroTab] : k === 'grow' ? 'bUp'
  : k === 'adv' ? 'bDun' : k === 'box' ? 'bRel' : k === 'shop' ? 'bShop' : null; }
function syncPanel(){
  const b = panelOpen ? bodyOf(curTab) : null;
  $('panel').style.display = panelOpen ? 'flex' : 'none';
  $('herosub').style.display = (panelOpen && curTab === 'hero') ? 'flex' : 'none';
  Object.keys(TABBODY).forEach(z => $(TABBODY[z]).classList.toggle('on', TABBODY[z] === b));
  document.querySelectorAll('#herosub .stab').forEach(x => x.classList.toggle('on', x.dataset.hero === heroTab));
  const tabs = [...document.querySelectorAll('.tab')];
  $('tabbar').classList.toggle('open', panelOpen);
  tabs.forEach((x, i) => {
    const me = panelOpen && x.dataset.t === curTab;
    x.classList.toggle('close', me);                       /* 열려 있으면 ✕ 칸으로 치환 */
    /* ✕ 칸은 카드가 아니라 함몰면이므로 좌우 구분홈을 지운다 */
    x.classList.toggle('pre', !!(panelOpen && tabs[i+1] && tabs[i+1].dataset.t === curTab));
    x.classList.toggle('fresh', !S.seen[x.dataset.t]);   /* 아직 안 연 탭에 NEW 리본 */
  });
  resizeCanvas();
}
function goTab(k, forceOpen){
  if(!forceOpen && panelOpen && k === curTab){ panelOpen = false; syncPanel(); return; }
  curTab = k; panelOpen = true;
  if(!S.seen[k]){ S.seen[k] = 1; }   /* 한 번 열면 NEW 리본이 사라진다 */
  syncPanel();
  uiDirty = true; renderUI();
}
document.querySelectorAll('.tab').forEach(t => { t.onclick = () => goTab(t.dataset.t); });
$('herosub').onclick = e => {
  const s = e.target.closest('[data-hero]');
  if(!s) return;
  heroTab = s.dataset.hero; S.heroTab = heroTab;
  syncPanel(); uiDirty = true; renderUI();
};
document.querySelectorAll('.side .ibtn[data-pop]').forEach(b => {
  b.onclick = () => {
    const k = b.dataset.pop;
    if(k === 'attend') openAttend();
    else if(k === 'roul') openRoulette(-1, '');
    else if(k === 'mail') openMail();
    else if(k === 'quest') openQuest();
    else if(k === 'dun') openDungeon();
    else if(k === 'promo') openPromo();
  };
});
document.querySelectorAll('.side .ibtn[data-lock]').forEach(b => {
  b.onclick = () => popup('🔒 ' + b.dataset.lock, '<p>아직 해금되지 않은 콘텐츠입니다.</p>');
});
$('facb').onclick = () => popup('🏠 시설', '<p>다음 일일 초기화까지 <b>' + $('facTm').textContent + '</b> 남았습니다.<br>'
  + '오늘 남은 무료 입장 <b>' + $('facBg').textContent + '</b>회</p>');
$('profBtn').onclick = openProfile;
document.querySelectorAll('[data-go]').forEach(b => b.onclick = e => {
  e.stopPropagation();
  goTab(b.dataset.go, true);
});
$('tutoBtn').onclick = claimTuto;

function renderUI(){
  if(panelOpen){
    if(curTab === 'grow') renderUp();
    else if(curTab === 'hero'){
      if(heroTab === 'eq')       renderEq();
      else if(heroTab === 'sk')  renderBanner('skill', 'bSk');
      else                       renderBanner('pet', 'bPet');
    }
    else if(curTab === 'adv')  renderDun();
    else if(curTab === 'box')  renderBanner('relic', 'bRel');
    else if(curTab === 'shop') renderShop();
  }
  const dunAlert = DUNGEONS.some(d => S.daily.dun[d.id] > 0 && cp() >= d.req(S.dun[d.id]));
  document.querySelectorAll('.tab').forEach(t => {
    const k = t.dataset.t;
    const al = k === 'hero' ? (collReady('equip') || collReady('skill') || collReady('pet'))
             : k === 'grow' ? S.sp > 0
             : k === 'adv'  ? dunAlert
             : k === 'box'  ? collReady('relic')
             : k === 'shop' ? AVATARS.some(a => !S.avatars[a.id] && S.dia >= a.cost)
             : false;
    t.classList.toggle('alert', !!al);
  });
  document.querySelectorAll('#herosub .stab').forEach(x => {
    const k = x.dataset.hero;
    x.classList.toggle('alert', !!collReady(k === 'eq' ? 'equip' : k === 'sk' ? 'skill' : 'pet'));
  });
  uiDirty = false;
}

/* ---- 오프라인 보상 (화면 01) ---- */
const OFF_MAX_H = 6;                        /* 최대 적립 시간 */
let offPend = null;                         /* {sec, gold, dia} — 아직 안 받은 보상 */

const hhmm = sec => Math.floor(sec/3600) + '시간 ' + Math.floor(sec%3600/60) + '분';

/* 보상을 계산해 팝업을 띄운다. mul 배를 곱해 지급한다. */
function showOfflineReward(sec, gold, dia){
  offPend = { sec: sec, gold: gold, dia: dia };
  $('ofrMax').textContent = '최대 ' + OFF_MAX_H + '시간 0분';
  $('ofrTime').textContent = hhmm(sec);
  $('ofrAmt').textContent = fmt(gold);
  $('offw').classList.add('on');
}
function closeOfflineReward(){ $('offw').classList.remove('on'); offPend = null; }
function claimOffline(mul){
  if(!offPend) return;
  S.gold += offPend.gold * mul;
  S.dia  += Math.floor(offPend.dia * mul);
  markDirty();
  closeOfflineReward();
}

function offlineReward(lastTime){
  if(!lastTime) return;
  const sec = Math.min((Date.now()-lastTime)/1000, OFF_MAX_H*3600);
  if(sec < 60) return;
  const gold = eGold(S.stage) * stat.goldMul * 1.2 * sec * 0.5;
  const dia = Math.floor(sec/20);          /* 분당 3 다이아 */
  showOfflineReward(sec, gold, dia);
}

/* ==========================================================================
   메인 루프
   ========================================================================== */
let last = 0, saveT = 0, uiT = 0, dayT = 0;
function loop(now){
  requestAnimationFrame(loop);
  if(!last) last = now;
  let dt = (now-last)/1000; last = now;
  if(dt > 0.1) dt = 0.1;
  S.playtime += dt;

  step(dt);
  draw();
  drawHud();
  drawTuto();

  uiT += dt;
  if(uiT > 0.35){ uiT = 0; renderUI(); }
  dayT += dt;
  if(dayT > 30){ dayT = 0; dailyCheck(); }
  saveT += dt;
  if(saveT > 5){ saveT = 0; save(); }
}

/* ---------------- 시작 ---------------- */
loadAtlases(() => {
  $('loading').classList.add('off');
  const lastTime = load();
  dailyCheck();
  markDirty();
  const owed = Math.max(0, (S.plv - 1)*SP_PER_LV - (S.sp + S.spAtk + S.spHp));
  if(owed > 0){ S.sp += owed; if(S.spAuto) autoSpend(); }
  if(!has('slash')){ S.own.slash = { n:0, l:1 }; S.eqSkill = ['slash']; }
  if(S.autoEquip) autoEquipAll();
  player.hp = stat.maxHp;
  setAnim(player, 'knight', 'idle', 8, true);
  syncPets();
  spawnStage();
  heroTab = HEROBODY[S.heroTab] ? S.heroTab : 'eq';
  syncPanel();
  /* 레퍼런스 팝업은 헤더에 ✕ 가 없다(22·07·06·03 전부). 대신 딤을 눌러도 닫히게 한다 */
  $('modal').onclick = e => { if(e.target === $('modal')) closeModal(); };
  $('ofrGet').onclick = () => claimOffline(1);
  $('ofrGet15').onclick = () => claimOffline(1.5);
  $('ofrGo').onclick = () => { closeOfflineReward(); goTab('shop', true); };
  renderUI();
  offlineReward(lastTime);
  addEventListener('visibilitychange', () => { if(document.hidden) save(); });
  addEventListener('beforeunload', save);
  requestAnimationFrame(loop);
});
</script>

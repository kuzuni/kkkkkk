  <!-- 화폐 아이콘 · 강화석 던전 입장권 — 작업 430(주인 재재지시 2026-08-30 «던전 입장권 색깔 여전히 비슷함.
       노랑(황금) 초록(수정) 갈색(고대) 회색(잊힌) 빨강(용) 흰색(창세) 주황(각성) 파랑(룬) 으로 해야할거 같다»)
       125 단일 출처 · 껍데기 기하(path 2줄)는 8장 **픽셀 동일**하다 — 세트로 읽히게 하는 것이 그 두 줄이라 건드리지 않는다.
       ⚠ 412 의 «L*64 한 밴드 · 색상만 돌린다» 규칙은 **폐기됐다** — 그 규칙이 여덟을 전부 중명도 중채도로 묶어
          색상환 이웃 넷(연두↔청록↔하늘↔청록2)이 «파랑 계열 넷» 으로 읽혔다(주인 «여전히 비슷함»).
       430 은 **이름이 색을 정한다**: 이 장 = 각성의 동굴 → «주황» · 채움 #FF9F55 · 테 #9F4B01(같은 색상의 어두운 짝).
       명도도 축이다 — 8장의 L* 를 29.5~100 에 **최소 8 간격**으로 벌려 회색조(색각 이상·저해상도)에서도 갈린다.
       속 문양은 «룬 방패» — 412 의 8종 실루엣·bbox 21×21·중심 (32,35.5) **그대로**(bbox Δ0).
       ⚠ 이 장은 채움이 밝아 흰 문양이 안 보인다 — 문양 잉크를 **테색**으로 갈았다(대비가 큰 쪽).
       게이트 tools/verify430.js 가 색이름 구간·ΔE·회색조 간격·문양 대비를, tools/verify402.js [B] 가 기하·문양을 잰다. -->

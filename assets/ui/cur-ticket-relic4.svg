<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="geometricPrecision">
  <!-- 화폐 아이콘 · 유물 던전 4단 입장권 — 작업 430(주인 재재지시 2026-08-30 «던전 입장권 색깔 여전히 비슷함.
       노랑(황금) 초록(수정) 갈색(고대) 회색(잊힌) 빨강(용) 흰색(창세) 주황(각성) 파랑(룬) 으로 해야할거 같다»)
       125 단일 출처 · 껍데기 기하(path 2줄)는 8장 **픽셀 동일**하다 — 세트로 읽히게 하는 것이 그 두 줄이라 건드리지 않는다.
       ⚠ 412 의 «L*64 한 밴드 · 색상만 돌린다» 규칙은 **폐기됐다** — 그 규칙이 여덟을 전부 중명도 중채도로 묶어
          색상환 이웃 넷(연두↔청록↔하늘↔청록2)이 «파랑 계열 넷» 으로 읽혔다(주인 «여전히 비슷함»).
       430 은 **이름이 색을 정한다**: 이 장 = 창세의 제단 → «흰색» · 채움 #FFFFFF · 테 #5A5A60(같은 색상의 어두운 짝).
       명도도 축이다 — 8장의 L* 를 29.5~100 에 **최소 8 간격**으로 벌려 회색조(색각 이상·저해상도)에서도 갈린다.
       속 문양은 «왕관» — 412 의 8종 실루엣·bbox 21×21 **그대로**(bbox Δ0) · 중심 (32,**35**)
            — 433(2026-08-30)이 35.5 에서 **0.5 올렸다**: 보이는 밝은 속띠는 23..47 이고(검은 테 y45..49 의
            안쪽 반을 속띠 path 가 나중에 덮어 그린다) 그 한가운데가 **35** 인데 문양이 35.5 에 앉아 있었다.
            선언 21 에 획 1.6 이 붙어 «그려진 잉크» 는 22.6 이라 슬랙이 1.31 뿐 — 0.5 쏠림이 아래 여유를
            **0.13** 으로 만들어 어두운 장의 문양 외곽선이 검은 테에 붙어 밑변이 잘려 보였다(위 1.19 ↔ 아래 0.13).
            자는 tools/probe433.js·tools/verify433.js — «선언 bbox» 가 아니라 **획까지 포함해 그려진 잉크**를 잰다.
       ⚠ 이 장은 채움이 밝아 흰 문양이 안 보인다 — 문양 잉크를 **테색**으로 갈았다(대비가 큰 쪽).
       그래서 문양 외곽선·세부 획은 **채움색**이다 — 안 그러면 어두운 잉크가 어두운 테와 밑변에서 붙어 잘려 보인다.
       ⚑ 444(2026-08-30) — «그려진 잉크» 를 어두운 5장과 한 세트로 되돌렸다. 이 장은 잉크가 테색이고 획이 채움색이라
            가운데 정렬된 획의 **안쪽 0.8 이 제 잉크를 깎고**(바깥 0.8 은 몸통과 같은 색이라 안 보인다) 그려진 잉크가
            선언 21 보다 작은 **19.4** 였다(어두운 5장은 획이 테색이라 21 + 1.6 = 22.6 으로 **커진다** — 같은 규격이
            방향만 반대다). 세로 덩치 최대÷최소가 **1.240** 으로 411 의 «≤ 1.05» 눈금을 넘었다.
            처방은 획을 없애거나 얇게 하는 것이 아니라 **`paint-order="stroke fill"`** — 획을 채움 **밑에** 깔아
            «안쪽으로 깎던 것» 을 «바깥으로 두르는 것» 으로 바꾼다. 획의 몫(어두운 테와의 분리)은 그대로 두고
            잉크만 되찾는다. 곁들여 뾰족한 꼭짓점이 획에 먹히던 것(창세 왕관 윗변 25 → 27 · 각성 칠각 «뭉툭함»)도
            같이 풀린다 — 채움이 위에 있으니 선언한 실루엣이 그대로 나온다.
            남는 3.8% 는 **선언 21 → 21.80 확대**로 반씩 나눠 가진다(중심 (32,35) 등방): 선언 덩치비 21.80/21 =
            1.038 · 그려진 잉크비 22.63/21.80 = 1.038 — 두 자 모두 1.05 안. ⚠ **더 키울 수 없다** — 획까지 포함해
            찍히는 폭이 21.80 + 1.6 = 23.40 이고 보이는 속띠가 23.94 뿐이라, 22.6 까지 키우면 획이 검은 테를 밟는다.
            자는 tools/verify444.js(덩치 축) · tools/verify433.js(자리 축) · tools/probe433.js.
       게이트 tools/verify430.js 가 색이름 구간·ΔE·회색조 간격·문양 대비를, tools/verify402.js [B] 가 기하·문양을 잰다. -->
  <path d="M4 17h56v10a5 5 0 0 0 0 10v10H4V37a5 5 0 0 0 0-10z" fill="#5A5A60" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
  <path d="M10 23h44v5.5a7 7 0 0 0 0 13V47H10v-5.5a7 7 0 0 0 0-13z" fill="#FFFFFF"/>
  <path d="M22.138 45.9L21.1 26.176 28.367 32.405 32 24.1 35.633 32.405 42.9 26.176 41.862 45.9z" fill="#5A5A60" opacity=".92" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round" paint-order="stroke fill"/>
</svg>

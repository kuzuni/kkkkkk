  <!-- 새겨진 망치 문양 — 이 재화가 «단련» 전용임을 형태로 알린다 -->
  <path d="M23 24h18v7H23z" fill="#3B0C0C"/>
  <path d="M30.5 31v13" stroke="#3B0C0C" stroke-width="5" stroke-linecap="round"/>
